<html lang="en">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Project Budget</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600&family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Same sheet as the hourly-rate and quote-to-invoice tools: riso on paper, baseline Blue + Bright Red and black. */
:root{
  --paper:#F7F3EA; --paper-raised:#FBF8F1; --ink:#111111; --ink-soft:#4A463F;
  --ink-1:#0078BF; --ink-2:#F15060; --display-ink:#0078BF; --eyebrow-ink:#3D5588; --accent-text:#B8293A;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --text:"Source Serif 4",Georgia,serif;
  --readable:"Atkinson Hyperlegible Next",Verdana,sans-serif;
  --label:"Atkinson Hyperlegible Mono","Courier New",monospace;
  --rule:2px; --rule-heavy:3px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body.readable{font-family:var(--readable)}
.wrap{max-width:560px;margin:0 auto}
a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 8px;border-bottom:var(--rule) solid var(--ink)}
.studio{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap;letter-spacing:.01em}
.toggle{font-family:var(--label);font-size:13px;font-weight:600;background:var(--paper-raised);color:var(--ink);border:var(--rule) solid var(--ink);min-height:44px;padding:0 12px;cursor:pointer;border-radius:0}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.progress{font-family:var(--label);font-size:13px;color:var(--ink-soft);padding-top:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;color:var(--eyebrow-ink);text-transform:uppercase;margin:20px 0 6px}
.over{position:relative;margin:0 0 16px}
.over h1,.over .ghost{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,56px);line-height:.9;text-transform:uppercase;margin:0;text-wrap:balance;mix-blend-mode:multiply}
.over h1{position:relative;color:var(--display-ink)}
.over .ghost{position:absolute;left:3px;top:3px;color:var(--ink-2)}
p{margin:0 0 14px}
.lead{font-size:19px}
.note{font-family:var(--label);font-size:13px;color:var(--ink-soft)}

.panel{background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:20px 16px;margin:18px 0}
.panel h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;margin:0 0 10px}
.panel h3{font-family:var(--label);font-weight:600;font-size:14px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}

.f{display:block;padding:10px 0;border-bottom:1px solid #CFC8B8}
.f:last-child{border-bottom:0}
.f label,.f .lbl{display:block;font-family:var(--readable);font-weight:600;font-size:16px;line-height:1.3;margin-bottom:6px}
.f .hint{display:block;font-family:var(--readable);font-size:14px;color:var(--ink-soft);line-height:1.4;margin-top:4px}
input,select,textarea{width:100%;min-height:44px;font-family:var(--readable);font-size:17px;padding:8px 10px;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);-webkit-text-fill-color:var(--ink);border-radius:0;color-scheme:light}
textarea{min-height:88px;resize:vertical;line-height:1.4}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.mini{display:block;font-family:var(--label);font-size:12px;margin-bottom:2px}

.ln{border:var(--rule) solid var(--ink);background:var(--paper);padding:10px;margin:10px 0}
.ln > * + *{margin-top:8px}
.ln .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--label);font-size:13px}
.ln .amt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--label);font-size:14px;font-variant-numeric:tabular-nums}
.ln.gap{border-color:var(--ink-2);border-style:dashed}
.flag{font-family:var(--readable);font-size:14px;color:var(--accent-text);line-height:1.4}

.part{border-bottom:1px solid #CFC8B8;padding:10px 0}
.part:last-child{border-bottom:0}
.tick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 0;min-height:44px;font-family:var(--readable);font-weight:600;font-size:16px;color:var(--ink);cursor:pointer}
.tick .box{flex:0 0 26px;height:26px;border:var(--rule) solid var(--ink);display:grid;place-items:center;font-family:var(--label);font-size:16px;background:var(--paper)}
.tick[aria-pressed="true"] .box{background:var(--ink);color:var(--paper)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who button{min-height:44px;font-family:var(--label);font-size:13px;font-weight:600;border:var(--rule) solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer;border-radius:0;padding:4px 6px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.who button.none[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#111}

.totals{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0}
.total{flex:1 1 140px;border-top:var(--rule-heavy) solid var(--ink);padding-top:6px}
.total .k{font-family:var(--label);font-size:13px}
.total .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.total.warn .v{color:var(--accent-text)}

.bars{margin:10px 0}
.meter{height:22px;background:#E6DFD0;position:relative;border:1px solid var(--ink)}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--ink-1)}
.meter + .mini{margin:4px 0 10px}

.fair{border:var(--rule) solid var(--ink-1);padding:10px 12px;margin:16px 0;font-size:16px;background:var(--paper-raised)}
.fair b{font-family:var(--label);font-size:13px;display:block;color:var(--eyebrow-ink);text-transform:uppercase;letter-spacing:.04em}
.tip{border-left:var(--rule-heavy) solid var(--ink-2);padding:2px 0 2px 12px;margin:16px 0;font-size:16px}
.tip b{font-family:var(--label);font-size:13px;display:block;text-transform:uppercase;letter-spacing:.04em}
.pause{display:block;font-family:var(--label);font-size:14px;font-weight:600;background:var(--ink);color:var(--paper);padding:12px 14px;margin:18px 0}
.pause::before{content:"Pause · "}

.sum{width:100%;border-collapse:collapse;font-family:var(--readable);font-size:15px;font-variant-numeric:tabular-nums}
.sum td{padding:7px 0;border-bottom:1px solid #CFC8B8;vertical-align:top}
.sum td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.sum tr.t td{border-top:var(--rule) solid var(--ink);border-bottom:0;font-weight:600}
.sum tr.gapr td{color:var(--accent-text);font-weight:600}
.sum small{display:block;font-family:var(--label);font-size:12px;color:var(--ink-soft);font-weight:400}

.btn{font-family:var(--label);font-weight:600;font-size:14px;min-height:48px;padding:0 18px;border:var(--rule) solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.small{min-height:44px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.choose{display:grid;gap:12px;margin:16px 0}
.pick{display:block;text-align:left;width:100%;background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:14px 16px;cursor:pointer;font:inherit;font-size:16px;color:var(--ink);border-radius:0}
.pick strong{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;display:block;line-height:1}
.pick em{font-family:var(--label);font-style:normal;font-size:12px;display:block;margin:4px 0;color:var(--eyebrow-ink);text-transform:uppercase;letter-spacing:.04em}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink-1);border-color:var(--ink-1)}

.checks{list-style:none;margin:0;padding:0;font-family:var(--readable);font-size:15px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #CFC8B8}
.checks li:last-child{border-bottom:0}
.checks .m{font-family:var(--label);font-weight:600;min-width:1.6em}
.checks li.no{color:var(--accent-text)}
.checks li.soft{color:var(--ink-soft)}

/* The document: plain, printable, two pages like the fund's model budget. */
.docs{overflow-x:auto;margin:18px 0}
.doc{background:#fff;color:#111;border:var(--rule) solid var(--ink);padding:18px 14px;margin:0 0 14px;font-family:var(--readable);font-size:12px;line-height:1.4;font-variant-numeric:tabular-nums;min-width:520px}
.doc .kind{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase;color:var(--display-ink)}
.doc .kind small{display:block;font-family:var(--label);font-size:11px;font-weight:600;color:#111;letter-spacing:.04em;margin-top:6px;text-transform:none}
.doc .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.doc .head .meta{text-align:right;max-width:55%}
.doc h4{font-family:var(--label);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px;border-bottom:2px solid #111;padding-bottom:3px}
.doc table{width:100%;border-collapse:collapse}
.doc th{font-family:var(--label);font-size:10px;font-weight:600;text-align:right;padding:3px 0 3px 8px;white-space:nowrap;border-bottom:1px solid #111}
.doc td{padding:4px 0 4px 8px;border-bottom:1px solid #ddd;text-align:right;vertical-align:top}
.doc th:first-child,.doc td:first-child{text-align:left;padding-left:0}
.doc td.l,.doc th.l{text-align:left}
.doc td .n{display:block;font-size:10px;color:#555;font-style:italic}
.doc tr.t td{border-top:2px solid #111;border-bottom:0;font-weight:600}
.doc tr.g td{font-weight:600;color:#B8293A}
.doc .k2{color:#555}
.doc .empty{color:#9a958b;font-style:italic}
.doc .foot{margin-top:12px;font-size:10px;color:#555}

.linkbox{font-family:var(--label);font-size:12px;word-break:break-all;background:var(--paper);border:1px solid var(--ink);padding:8px;max-height:5.5em;overflow:auto;display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--rule-heavy) solid var(--ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.bar .live{flex:1;text-align:center;font-family:var(--label);font-size:13px;line-height:1.2}
nav.bar .live b{display:block;font-family:var(--display);font-weight:900;font-size:24px}
nav.bar .live b.warn{color:var(--accent-text)}
footer{padding:28px 0 0;font-family:var(--label);font-size:12px;color:var(--ink-soft)}

#printarea{display:none}
@media print{
  @page{margin:12mm}
  body{padding:0;background:#fff}
  .wrap,nav.bar{display:none!important}
  #printarea{display:block}
  #printarea .doc{border:0;margin:0;padding:0;min-width:0}
  #printarea .doc + .doc,#printarea .reopen{break-before:page}
  #printarea .reopen{font-family:var(--readable);font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

</nav>

function fresh(k){var v=copy(PEOPLE[k].v);v.custom=v.custom||[];return v;}

function get(path){return path.split(".").reduce(function(o,k){return o==null?undefined:o[k];},S.w);}
function set(path,val){var ks=path.split("."),o=S.w;for(var i=0;i<ks.length-1;i++){o=o[ks[i]];if(o==null)return;}o[ks[ks.length-1]]=val;}
function partLabel(k){if(k.charAt(0)==="x"){var c=S.w.custom[+k.slice(1)];return c||"Something else";}return label(PARTS,k);}
function allParts(){return PART_KEYS.concat(S.w.custom.map(function(_,i){return "x"+i;}));}
function isOn(k){return S.w.parts.indexOf(k)>=0;}

/* ---------- the link carries everything, deflated where the browser can ---------- */
function b64u(bytes){var bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unb64u(str){var b=str.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function snapshot(){return {v:1,s:S.start,t:S.step,w:S.w};}
function encodeSync(){return "j"+b64u(new TextEncoder().encode(JSON.stringify(snapshot())));}
function canZip(){return typeof CompressionStream==="function"&&typeof DecompressionStream==="function"&&typeof Response==="function";}
function encodeZip(){
  var stream=new Blob([new TextEncoder().encode(JSON.stringify(snapshot()))]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Response(stream).arrayBuffer().then(function(buf){return "z"+b64u(new Uint8Array(buf));});
}
function decode(str){
  if(str.charAt(0)==="z"){
    var stream=new Blob([unb64u(str.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(function(t){restore(JSON.parse(t));});
  }
  if(str.charAt(0)==="j"){restore(JSON.parse(new TextDecoder().decode(unb64u(str.slice(1)))));return Promise.resolve();}
  return Promise.reject(new Error("unknown"));
}
function num(x,max){var n=Number(x);return isFinite(n)&&n>=0?Math.min(n,max||1e7):0;}
function str(x,n){return x==null?"":String(x).slice(0,n||300);}
function payOk(p,nsrc){return p==="f"||p==="m"||p==="n"||(/^s\d+$/.test(p)&&+p.slice(1)<nsrc);}
function restore(o){
  var start=PEOPLE[o.s]?o.s:"noor", w=o.w||{}, base=fresh(start);
  base.custom=Array.isArray(w.custom)?w.custom.slice(0,3).map(function(c){return str(c,80);}):[];
  var keys=PART_KEYS.concat(base.custom.map(function(_,i){return "x"+i;}));
  if(w.p){["me","title"].forEach(function(k){base.p[k]=str(w.p[k],120);});["ambition","outcome"].forEach(function(k){base.p[k]=str(w.p[k],400);});
    base.p.months=Math.min(36,Math.max(1,Math.round(num(w.p.months))||1));base.p.days=Math.min(5,num(w.p.days));}
  base.day1=num(w.day1,1000); base.vat=w.vat==="no"?"no":"yes";
  if(w.fund){base.fund.preset=FUNDS[w.fund.preset]?w.fund.preset:(w.fund.preset===""?"":"project");base.fund.name=str(w.fund.name,80);base.fund.max=num(w.fund.max);base.fund.min=Math.min(100,num(w.fund.min));base.fund.cap=num(w.fund.cap,1000);}
  base.src=(Array.isArray(w.src)?w.src:[]).slice(0,8).map(function(s){return {name:str(s.name,80),type:label(TYPES,s.type)!==s.type?s.type:"grant",status:label(STATUS,s.status)!==s.status?s.status:"hoped"};});
  var ns=base.src.length;
  base.parts=(Array.isArray(w.parts)?w.parts:[]).filter(function(k){return keys.indexOf(k)>=0;});
  base.people=(Array.isArray(w.people)?w.people:[]).slice(0,40).filter(function(l){return l&&keys.indexOf(l.part)>=0;}).map(function(l){
    return {part:l.part,who:["me","paid","free","none"].indexOf(l.who)>=0?l.who:"none",name:str(l.name,80),role:str(l.role,80),h:num(l.h,10000),r:num(l.r,1000),
      pay:payOk(l.pay,ns)?l.pay:"n",rest:payOk(l.rest,ns)?l.rest:"n",note:str(l.note,160),vr:[0,0.09,0.21].indexOf(l.vr)>=0?l.vr:0.21};});
  base.mat=(Array.isArray(w.mat)?w.mat:[]).slice(0,30).map(function(m){
    return {cat:label(CATS,m.cat)!==m.cat?m.cat:"other",d:str(m.d,120),q:num(m.q,100000),p:num(m.p,1000000),pay:payOk(m.pay,ns)?m.pay:"n",vr:[0,0.09,0.21].indexOf(m.vr)>=0?m.vr:0.21};});
  S.start=start;S.w=base;S.step=Math.min(LAST,Math.max(0,+o.t||0));
}
var saveTimer=null,CODE="",codeFor="";
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var key=JSON.stringify(snapshot());
    if(key===codeFor&&CODE) return;
    var store=function(code){
      if(key!==JSON.stringify(snapshot())) return;
      CODE=code;codeFor=key;
      try{history.replaceState(null,"",location.pathname+"#s="+code);}catch(e){}
      try{localStorage.setItem(STORE,code);}catch(e){}
      refreshLink();
    };
    if(canZip()) encodeZip().then(store,function(){store(encodeSync());}); else store(encodeSync());
  },300);
}
function load(){
  var h="";try{h=location.hash||"";}catch(e){}
  var tryCode=function(c){try{return decode(c);}catch(e){return Promise.reject(e);}};
  var fromStore=function(){try{var c=localStorage.getItem(STORE);if(c)return tryCode(c).catch(function(){});}catch(e){}return Promise.resolve();};
  if(h.indexOf("#s=")===0) return tryCode(h.slice(3)).catch(fromStore);
  return fromStore();
}

/* ---------- money: whole euros, like the fund's model budget ---------- */
function eur(n){return (n<0?"−€":"€")+Math.abs(Math.round(n||0)).toLocaleString("en-GB");}
function rate(n){return "€"+Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function inclVat(){return S.w.vat==="no";}
function personVat(l){return inclVat()&&l.who==="paid"?(l.vr==null?0.21:l.vr):0;}
function matVat(m){return inclVat()?m.vr:0;}
function personBase(l){return l.who==="none"?0:Math.round(l.h*l.r);}
function personAmt(l){return Math.round(personBase(l)*(1+personVat(l)));}
function matBase(m){return Math.round(m.q*m.p);}
function matAmt(m){return Math.round(matBase(m)*(1+matVat(m)));}
function payerName(p){
  if(p==="f") return S.w.fund.name||"The fund";
  if(p==="m") return "Me, own contribution";
  if(p==="n") return "Nobody yet";
  var s=S.w.src[+p.slice(1)]; return s?(s.name||"Unnamed"):"Nobody yet";
}
/* The heart of it: every line has a payer. The fund pays a person at most its hourly cap; the rest needs another payer. */
function overCap(l){return l.pay==="f"&&l.who!=="free"&&l.who!=="none"&&S.w.fund.cap>0&&l.r>S.w.fund.cap;}
function calc(){
  var w=S.w,c={people:0,mine:0,mineH:0,others:0,othersH:0,mat:0,total:0,by:{f:0,m:0,n:0},rows:[]};
  w.src.forEach(function(_,i){c.by["s"+i]=0;});
  var add=function(p,a){if(c.by[p]===undefined)p="n";c.by[p]+=a;};
  w.people.forEach(function(l){
    var a=personAmt(l); c.people+=a;
    if(l.who==="me"){c.mine+=a;c.mineH+=l.h;}
    else if(l.who==="paid"||l.who==="free"){c.others+=a;c.othersH+=l.h;}
    if(l.who==="none") return;
    if(overCap(l)){var fa=Math.round(Math.round(l.h*w.fund.cap)*(1+personVat(l)));add("f",fa);add(l.rest,a-fa);}
    else add(l.pay,a);
  });
  w.mat.forEach(function(m){var a=matAmt(m);c.mat+=a;add(m.pay,a);});
  c.total=c.people+c.mat;
  c.cof=0; w.src.forEach(function(_,i){c.cof+=c.by["s"+i];});
  c.own=c.by.m; c.fund=c.by.f; c.open=c.by.n;
  c.need=c.total-c.cof-c.own;
  c.pct=c.total?c.cof/c.total*100:0;
  c.commitH=Math.round(w.p.months*WEEKS_PER_MONTH*w.p.days*HOURS_PER_DAY);
  c.myRate=c.mineH?c.mine/c.mineH:0;
  var paidH=0,paidA=0;w.people.forEach(function(l){if(l.who==="paid"||l.who==="free"){paidH+=l.h;paidA+=personBase(l);}});
  c.otherRate=paidH?paidA/paidH:0;
  return c;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch];});}

function txt(path,lbl,hint,type,area,max){

  var input=area?'<textarea id="'+id+'" data-p="'+path+'" maxlength="'+(max||400)+'">'+esc(v)+'</textarea>'
    :'<input id="'+id+'" data-p="'+path+'" '+(type==="number"?'type="number" data-n="1" inputmode="decimal" min="0" step="any"':'type="text" maxlength="'+(max||120)+'"')+' value="'+esc(v)+'">';
  return '<div class="f"><label for="'+id+'">'+lbl+'</label>'+input+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>';
}

   pause("Look at your cofinancing. Who have you asked yet? Who would you ask first, and why would they say yes?");

 }},
 {t:"Who pays for what",r:function(){

/* ---------- checks ---------- */
function checks(c){
  var w=S.w,f=w.fund,list=[];
  var none=w.people.filter(function(l){return l.who==="none";}).map(function(l){return partLabel(l.part);});
  var emptyParts=w.parts.filter(function(k){return !linesOfPart(k).length;}).map(partLabel);
  list.push(["Every part has someone who does it",!none.length&&!emptyParts.length,none.concat(emptyParts).join(", ")]);
  var noHours=w.people.filter(function(l){return l.who!=="none"&&!(l.h>0&&l.r>0);});
  list.push(["Every person has hours and a rate",!noHours.length,noHours.map(personName).join(", ")]);
  list.push(["Your own hours are in it",c.mineH>0]);
  list.push(["Your hours match your commitment",c.commitH>0&&c.mineH>=c.commitH*0.9,c.commitH>c.mineH?Math.round(c.commitH-c.mineH)+" hours given away":"","soft"]);
  var vague=w.mat.filter(function(m){return !m.d||/unforeseen|onvoorzien|misc|various|diverse/i.test(m.d);});
  list.push(["Every cost is named, no lumps",!vague.length]);
  list.push(["Every euro has a payer",c.open===0&&(c.total>0),c.open?eur(c.open)+" not covered yet":""]);
  list.push(["The fund stays under its maximum",!f.max||c.fund<=f.max,c.fund>f.max?eur(c.fund-f.max)+" too much":""]);
  if(f.min>0) list.push(["Others pay at least "+f.min+"%",c.pct>=f.min,Math.round(c.pct)+"% now"]);
  var hoped=w.src.filter(function(s,i){return s.status==="hoped"&&c.by["s"+i]>0;}).map(function(s){return s.name;});
  list.push(["Everyone you count on has been asked",!hoped.length,hoped.join(", ")+(hoped.length?": not asked yet":""),"soft"]);
  return list;
}
function checkList(list){return '<ul class="checks">'+list.map(function(x){var ok=!!x[1],cls=ok?"":(x[3]==="soft"?"soft":"no");return '<li class="'+cls+'"><span class="m">'+(ok?"✓":x[3]==="soft"?"?":"–")+'</span><span>'+x[0]+(!ok&&x[2]?' <i>('+esc(x[2])+')</i>':'')+'</span></li>';}).join("")+'</ul>';}

/* ---------- coverage table ---------- */
function coverHtml(c){
  var w=S.w,rows='';
  w.src.forEach(function(s,i){rows+='<tr><td>'+esc(s.name||"Unnamed")+'<small>'+label(TYPES,s.type)+' · '+label(STATUS,s.status)+'</small></td><td>'+eur(c.by["s"+i])+'</td></tr>';});
  return '<table class="sum">'+(rows||'<tr><td colspan="2"><span class="note">Nobody else yet.</span></td></tr>')+
   '<tr class="t"><td>Cofinancing<small>'+Math.round(c.pct)+'% of the total'+(w.fund.min?', the fund asks at least '+w.fund.min+'%':'')+'</small></td><td>'+eur(c.cof)+'</td></tr>'+
   '<tr><td>Me, own contribution</td><td>'+eur(c.own)+'</td></tr>'+
   '<tr><td>'+esc(w.fund.name||"The fund")+'<small>pays at most '+eur(w.fund.max)+'</small></td><td>'+eur(c.fund)+'</td></tr>'+
   (c.open?'<tr class="gapr"><td>Nobody yet</td><td>'+eur(c.open)+'</td></tr>':'')+
   '<tr class="t"><td>Total project costs</td><td>'+eur(c.total)+'</td></tr></table>'+
   '<div class="totals" style="margin-top:12px"><div class="total'+(c.open?" warn":"")+'"><div class="k">'+(c.open?"Not covered yet":"Balanced")+'</div><div class="v">'+(c.open?eur(c.open):"✓")+'</div></div>'+
   '<div class="total"><div class="k">You ask the fund</div><div class="v">'+eur(c.need)+'</div></div></div>'+
   '<p class="note" style="margin-top:8px">What you ask the fund is the total, minus cofinancing, minus your own contribution.</p>';
}

/* ---------- the document ---------- */
function v(s,fb){return s?esc(s):'<span class="empty">'+fb+'</span>';}
function docHtml(c){
  var w=S.w,inc=inclVat(),basis=inc?"with VAT":"without VAT";
  var head='<div class="head"><div class="kind">%K%<small>'+v(w.p.title,"working title")+'</small></div><div class="meta">'+v(w.p.me,"your name")+'<br>'+w.p.months+' months · '+w.p.days+' days a week<br>Amounts '+basis+', in whole euros</div></div>';
  var ppl=w.people.filter(function(l){return l.who!=="none";});
  var p1='<div class="doc">'+head.replace("%K%","Budget")+
   (w.p.ambition?'<p>'+esc(w.p.ambition)+'</p>':'')+
   '<h4>People</h4><table><thead><tr><th class="l">Activity</th><th>Hours</th><th>Rate</th><th>Total</th><th class="l">Who, role</th><th class="l">Paid by</th></tr></thead><tbody>'+
   (ppl.length?ppl.map(function(l){
     var pb=payerName(l.pay)+(overCap(l)?" (up to "+rate(w.fund.cap)+"/h), rest "+payerName(l.rest):"");
     return '<tr><td>'+esc(partLabel(l.part))+(l.note?'<span class="n">'+esc(l.note)+'</span>':'')+'</td><td>'+l.h+'</td><td>'+rate(l.r)+'</td><td>'+eur(personAmt(l))+'</td><td class="l">'+esc(personName(l))+(l.role?', '+esc(l.role):'')+'</td><td class="l">'+esc(pb)+'</td></tr>';}).join(""):'<tr><td colspan="6"><span class="empty">No people yet</span></td></tr>')+
   '<tr class="t"><td>All people</td><td></td><td></td><td>'+eur(c.people)+'</td><td></td><td></td></tr></tbody></table>'+
   (w.people.some(function(l){return l.who==="none";})?'<p class="k2">Still without a person: '+esc(w.people.filter(function(l){return l.who==="none";}).map(function(l){return partLabel(l.part);}).join(", "))+'.</p>':'')+
   '<h4>Material costs</h4><table><thead><tr><th class="l">Kind</th><th class="l">What</th><th>Number</th><th>Each</th><th>Total</th><th class="l">Paid by</th></tr></thead><tbody>'+
   (w.mat.length?w.mat.map(function(m){return '<tr><td>'+esc(label(CATS,m.cat))+'</td><td class="l">'+v(m.d,"description")+'</td><td>'+m.q+'</td><td>'+eur(m.p)+'</td><td>'+eur(matAmt(m))+'</td><td class="l">'+esc(payerName(m.pay))+'</td></tr>';}).join(""):'<tr><td colspan="6"><span class="empty">No material costs yet</span></td></tr>')+
   '<tr class="t"><td>All material costs</td><td></td><td></td><td></td><td>'+eur(c.mat)+'</td><td></td></tr></tbody></table>'+
   '<table style="margin-top:10px"><tr class="t"><td>Total project costs, '+basis+'</td><td>'+eur(c.total)+'</td></tr></table>'+
   '<p class="foot">A practice budget from the Economic Cultures workshop. '+(inc?"VAT is included because it can't be reclaimed.":"Without VAT, because the VAT on costs is reclaimed.")+'</p></div>';
  var rows=w.src.map(function(s,i){
    var what=[];w.people.forEach(function(l){if(l.who!=="none"&&(l.pay==="s"+i||(overCap(l)&&l.rest==="s"+i)))what.push(partLabel(l.part)+" ("+personName(l)+")");});
    w.mat.forEach(function(m){if(m.pay==="s"+i)what.push(m.d||"a cost");});
    return '<tr><td>'+esc(label(TYPES,s.type))+'</td><td class="l">'+v(s.name,"name")+'<span class="n">'+esc(what.join("; "))+'</span></td><td>'+eur(c.by["s"+i])+'</td><td class="l">'+label(STATUS,s.status)+'</td></tr>';}).join("");
  var p2='<div class="doc">'+head.replace("%K%","Coverage plan")+
   '<h4>Cofinancing</h4><table><thead><tr><th class="l">Kind</th><th class="l">From, and for what</th><th>Amount</th><th class="l">Status</th></tr></thead><tbody>'+
   (rows||'<tr><td colspan="4"><span class="empty">No cofinancing yet</span></td></tr>')+
   '<tr class="t"><td colspan="2">Total cofinancing, '+Math.round(c.pct)+'% of the total</td><td>'+eur(c.cof)+'</td><td></td></tr></tbody></table>'+
   '<table style="margin-top:10px"><tbody><tr><td>Own contribution</td><td>'+eur(c.own)+'</td></tr><tr><td>Total project costs</td><td>'+eur(c.total)+'</td></tr>'+
   '<tr class="t"><td>Asked from the fund: '+esc(w.fund.name||"unnamed")+'<span class="n">total − cofinancing − own contribution</span></td><td>'+eur(c.need)+'</td></tr>'+
   (c.open?'<tr class="g"><td>of which nobody pays yet</td><td>'+eur(c.open)+'</td></tr>':'')+'</tbody></table>'+
   '<p class="foot">Fund rules used: pays at most '+eur(w.fund.max)+(w.fund.min?', others pay at least '+w.fund.min+'%':', no cofinancing asked')+', hourly rate at most '+rate(w.fund.cap)+'. '+(w.p.outcome?'When it is done: '+esc(w.p.outcome):'')+'</p></div>';
  return p1+p2;
}

/* ---------- outputs ---------- */
function update(){
  var c=calc(),w=S.w,vals={
    commitH:c.commitH.toLocaleString("en-GB")+" hours",mineH:c.mineH.toLocaleString("en-GB")+" hours",
    mine:eur(c.mine),others:eur(c.others),people:eur(c.people),mat:eur(c.mat),total:eur(c.total),
    giveaway:c.commitH>c.mineH?Math.round(c.commitH-c.mineH).toLocaleString("en-GB")+" h · "+eur((c.commitH-c.mineH)*(c.myRate||w.day1)):"None",
    myRate:c.myRate?rate(Math.round(c.myRate*100)/100):"—",otherRate:c.otherRate?rate(Math.round(c.otherRate*100)/100):"—",
    myShare:c.people?Math.round(c.mine/c.people*100)+"%":"—"};
  w.people.forEach(function(l,i){vals["pa"+i]=eur(personAmt(l));if(overCap(l)){var fa=Math.round(Math.round(l.h*w.fund.cap)*(1+personVat(l)));vals["rest"+i]=eur(personAmt(l)-fa);}});
  w.mat.forEach(function(m,i){vals["ma"+i]=eur(matAmt(m));});
  document.querySelectorAll("[data-o]").forEach(function(el){
    var k=el.getAttribute("data-o");
    if(vals[k]!==undefined) el.textContent=vals[k];
    else if(k==="mineBar"){el.style.width=(c.commitH?Math.min(100,c.mineH/c.commitH*100):0)+"%";}
    else if(k==="cover") el.innerHTML=coverHtml(c);
    else if(k==="checks") el.innerHTML=checkList(checks(c));
    else if(k==="doc") el.innerHTML=docHtml(c);
  });
  var live=document.getElementById("live");
  if(S.step===0) live.innerHTML="";
  else if(S.step<=2) live.innerHTML='Your time<b>'+c.commitH.toLocaleString("en-GB")+' h</b>';
  else if(S.step<=6) live.innerHTML='Project costs<b>'+eur(c.total)+'</b>';
  else live.innerHTML=c.open?'Not covered yet<b class="warn">'+eur(c.open)+'</b>':'Balanced<b>'+eur(c.total)+'</b>';
  persist();
}
function shareUrl(){var base="";try{base=location.origin+location.pathname+"?open";}catch(e){}return base+"#s="+(CODE&&codeFor===JSON.stringify(snapshot())?CODE:encodeSync());}
function refreshLink(){
  var u=shareUrl();
  document.querySelectorAll('[data-o="link"]').forEach(function(el){el.textContent=u;el.setAttribute("href",u);});
}

/* ---------- render & events ---------- */
var stage=document.getElementById("stage");
function render(focus){
  var y=window.scrollY;
  stage.innerHTML=STEPS[S.step].r();
  document.getElementById("progress").innerHTML='<span>'+(S.step?"Step "+S.step+" of 9 · "+STEPS[S.step].t:"Start")+'</span><span>'+(S.step?"Started from "+(S.start==="own"?"my own project":PEOPLE[S.start].who):"")+'</span>';
  document.getElementById("back").style.visibility=S.step===0?"hidden":"";
  var n=document.getElementById("next");n.textContent=S.step===0?"Begin":S.step===LAST?"Save as PDF":"Next";
  update();refreshLink();
  if(focus){var h=stage.querySelector("h1");if(h)h.focus({preventScroll:true});window.scrollTo(0,0);}else window.scrollTo(0,y);
}
function go(d){S.step=Math.min(LAST,Math.max(0,S.step+d));render(true);}
document.getElementById("next").onclick=function(){if(S.step<LAST)go(1);else printDoc();};
document.getElementById("back").onclick=function(){if(S.step>0)go(-1);};
function onEdit(e){
  var t=e.target,p=t.getAttribute("data-p");if(!p)return;
  var val;
  if(t.getAttribute("data-n")){var n=parseFloat(String(t.value).replace(",","."));val=isFinite(n)&&n>=0?n:0;
    if(p==="p.months")val=Math.min(36,Math.max(0,Math.round(val)));if(p==="p.days")val=Math.min(5,val);if(p==="fund.min")val=Math.min(100,val);}
  else if(t.tagName==="SELECT"){val=t.value;if(/\.vr$/.test(p))val=Number(val);}
  else val=String(t.value).slice(0,400);
  set(p,val);
  if(p==="fund.name"||p==="fund.max"||p==="fund.min"||p==="fund.cap")S.w.fund.preset="";
  if(t.tagName==="SELECT"&&e.type==="change"&&(/\.pay$|\.rest$|\.type$/.test(p))){render(false);return;}
  update();
}
stage.addEventListener("input",function(e){if(e.target.tagName!=="SELECT")onEdit(e);});
stage.addEventListener("change",function(e){if(e.target.tagName==="SELECT")onEdit(e);});
function newPerson(k){return P(k,"me","","",0,S.w.day1||0,"f");}
function removeSource(i){
  S.w.src.splice(i,1);
  var fix=function(p){if(p==="s"+i)return "n";if(/^s\d+$/.test(p)&&+p.slice(1)>i)return "s"+(+p.slice(1)-1);return p;};
  S.w.people.forEach(function(l){l.pay=fix(l.pay);l.rest=fix(l.rest);});S.w.mat.forEach(function(m){m.pay=fix(m.pay);});
}
stage.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a;
  if((a=b.getAttribute("data-start"))){S.start=a;S.w=fresh(a);render(false);return;}
  if((a=b.getAttribute("data-part"))){
    var i=S.w.parts.indexOf(a);
    if(i>=0){S.w.parts.splice(i,1);S.w.people=S.w.people.filter(function(l){return l.part!==a;});}
    else{S.w.parts.push(a);if(!linesOfPart(a).length)S.w.people.push(P(a,"none","",partLabel(a),0,0,"n"));}
    render(false);return;}
  if((a=b.getAttribute("data-who"))){
    var pr=a.split("."),l=S.w.people[+pr[0]],was=l.who;l.who=pr[1];
    if(l.who==="me"){if(!l.r)l.r=S.w.day1||0;if(l.pay==="n")l.pay="f";}
    if(l.who==="paid"&&l.pay==="n")l.pay="f";
    if(l.who==="free"){var k=-1;S.w.src.forEach(function(s,j){if(k<0&&s.type==="kind")k=j;});l.pay=k>=0?"s"+k:"n";}
    if(l.who==="none")l.pay="n";
    if(was==="none"&&l.role===partLabel(l.part))l.role="";
    render(false);return;}
  if((a=b.getAttribute("data-addp"))){if(S.w.people.length<40)S.w.people.push(newPerson(a));render(false);return;}
  if((a=b.getAttribute("data-del"))){var d=a.split(".");if(d[0]==="src")removeSource(+d[1]);else S.w[d[0]].splice(+d[1],1);render(false);return;}
  if((a=b.getAttribute("data-vat"))){S.w.vat=a;render(false);return;}
  if((a=b.getAttribute("data-fund"))){var f=FUNDS[a];S.w.fund={preset:a,name:f.name,max:f.max,min:f.min,cap:f.cap};render(false);return;}
  a=b.getAttribute("data-act");
  if(a==="addpart"){if(S.w.custom.length<3){S.w.custom.push("");}render(false);return;}
  if(a==="addmat"){if(S.w.mat.length<30)S.w.mat.push(M("material","",1,0,"f"));render(false);return;}
  if(a==="addsrc"){if(S.w.src.length<8)S.w.src.push({name:"",type:"partner",status:"hoped"});render(false);return;}
  if(a==="print"){printDoc();return;}
  if(a==="copy"){var url=shareUrl(),m=stage.querySelector('[data-o="copyMsg"]');
    var fallback=function(){var box=stage.querySelector('[data-o="link"]');var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Selected. Copy it from your phone's menu.";};
    try{navigator.clipboard.writeText(url).then(function(){m.textContent="Copied.";},fallback);}catch(err){fallback();}}
});
function printDoc(){
  var u=shareUrl();
  document.getElementById("printarea").innerHTML=docHtml(calc())+
    '<div class="reopen"><p><b>Reopen this in the tool.</b> Tap the link below. Everything lives in the link, not with us.</p><p><a href="'+esc(u)+'">Open it in the tool, as you left it</a></p></div>';
  var prev=document.title;
  try{document.title="Project budget "+(S.w.p.title||"")+" "+(S.w.p.me||"");}catch(e){}
  var done=function(){document.title=prev;window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  try{window.print();}catch(err){}
}
var rb=document.getElementById("readable");
try{if(localStorage.getItem("ec-readable")==="1"){document.body.classList.add("readable");rb.setAttribute("aria-pressed","true");}}catch(e){}
rb.onclick=function(){var on=document.body.classList.toggle("readable");rb.setAttribute("aria-pressed",String(on));try{localStorage.setItem("ec-readable",on?"1":"0");}catch(e){}};

window.__budget={S:S,calc:calc,checks:checks,fresh:fresh,PEOPLE:PEOPLE};
load().then(function(){},function(){}).then(function(){render(false);refreshLink();});
})();
