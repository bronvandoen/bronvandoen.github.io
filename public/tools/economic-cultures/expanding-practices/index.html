<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget Your Ambition, Together</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600&family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Same sheet as the hourly-rate and quote-to-invoice tools: riso on paper, baseline Blue + Bright Red and black. */
:root{
  --paper:#F7F3EA; --paper-raised:#FBF8F1; --ink:#111111; --ink-soft:#4A463F;
  --ink-1:#0078BF; --ink-2:#F15060; --display-ink:#0078BF; --eyebrow-ink:#3D5588; --accent-text:#B8293A;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --text:"Source Serif 4",Georgia,serif;
  --readable:"Atkinson Hyperlegible Next",Verdana,sans-serif;
  --label:"Atkinson Hyperlegible Mono","Courier New",monospace;
  --rule:2px; --rule-heavy:3px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body.readable{font-family:var(--readable)}
.wrap{max-width:560px;margin:0 auto}
a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 8px;border-bottom:var(--rule) solid var(--ink)}
.studio{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap;letter-spacing:.01em}
.toggle{font-family:var(--label);font-size:13px;font-weight:600;background:var(--paper-raised);color:var(--ink);border:var(--rule) solid var(--ink);min-height:44px;padding:0 12px;cursor:pointer;border-radius:0}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.progress{font-family:var(--label);font-size:13px;color:var(--ink-soft);padding-top:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;color:var(--eyebrow-ink);text-transform:uppercase;margin:20px 0 6px}
.over{position:relative;margin:0 0 16px}
.over h1,.over .ghost{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,56px);line-height:.9;text-transform:uppercase;margin:0;text-wrap:balance;mix-blend-mode:multiply}
.over h1{position:relative;color:var(--display-ink)}
.over .ghost{position:absolute;left:3px;top:3px;color:var(--ink-2)}
p{margin:0 0 14px}
.lead{font-size:19px}
.note{font-family:var(--label);font-size:13px;color:var(--ink-soft)}

.panel{background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:20px 16px;margin:18px 0}
.panel h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;margin:0 0 10px}
.panel h3{font-family:var(--label);font-weight:600;font-size:14px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}

.f{display:block;padding:10px 0;border-bottom:1px solid #CFC8B8}
.f:last-child{border-bottom:0}
.f label,.f .lbl{display:block;font-family:var(--readable);font-weight:600;font-size:16px;line-height:1.3;margin-bottom:6px}
.f .hint{display:block;font-family:var(--readable);font-size:14px;color:var(--ink-soft);line-height:1.4;margin-top:4px}
input,select,textarea{width:100%;min-height:44px;font-family:var(--readable);font-size:17px;padding:8px 10px;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);-webkit-text-fill-color:var(--ink);border-radius:0;color-scheme:light}
textarea{min-height:88px;resize:vertical;line-height:1.4}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.mini{display:block;font-family:var(--label);font-size:12px;margin-bottom:2px}

.ln{border:var(--rule) solid var(--ink);background:var(--paper);padding:10px;margin:10px 0}
.ln > * + *{margin-top:8px}
.ln .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--label);font-size:13px}
.ln .amt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--label);font-size:14px;font-variant-numeric:tabular-nums}
.ln.gap{border-color:var(--ink-2);border-style:dashed}
.flag{font-family:var(--readable);font-size:14px;color:var(--accent-text);line-height:1.4}
.flag:empty{display:none}

.part{border-bottom:1px solid #CFC8B8;padding:10px 0}
.part:last-child{border-bottom:0}
.tick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 0;min-height:44px;font-family:var(--readable);font-weight:600;font-size:16px;color:var(--ink);cursor:pointer}
.tick .box{flex:0 0 26px;height:26px;border:var(--rule) solid var(--ink);display:grid;place-items:center;font-family:var(--label);font-size:16px;background:var(--paper)}
.tick[aria-pressed="true"] .box{background:var(--ink);color:var(--paper)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who button{min-height:44px;font-family:var(--label);font-size:13px;font-weight:600;border:var(--rule) solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer;border-radius:0;padding:4px 6px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.who button.none[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#111}

.totals{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0}
.total{flex:1 1 140px;border-top:var(--rule-heavy) solid var(--ink);padding-top:6px}
.total .k{font-family:var(--label);font-size:13px}
.total .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.total.warn .v{color:var(--accent-text)}

.bars{margin:10px 0}
.meter{height:22px;background:#E6DFD0;position:relative;border:1px solid var(--ink)}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.meter + .mini{margin:4px 0 10px}

.fair{border:var(--rule) solid var(--ink-1);padding:10px 12px;margin:16px 0;font-size:16px;background:var(--paper-raised)}
.fair b{font-family:var(--label);font-size:13px;display:block;color:var(--eyebrow-ink);text-transform:uppercase;letter-spacing:.04em}
.tip{border-left:var(--rule-heavy) solid var(--ink-2);padding:2px 0 2px 12px;margin:16px 0;font-size:16px}
.tip b{font-family:var(--label);font-size:13px;display:block;text-transform:uppercase;letter-spacing:.04em}
.send .row{margin-top:12px}.send .consent{border:var(--rule) solid var(--ink);background:var(--paper);padding:14px 16px;margin-top:12px}.send .consent ul{margin:8px 0 0;padding-left:20px;font-family:var(--readable);font-size:15px;line-height:1.45}.send .status{font-family:var(--readable);font-size:15px;line-height:1.4;margin-top:10px}.send .status.ok{font-weight:700}
.done{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.2;background:var(--accent-text);color:var(--paper);padding:14px 16px;margin:18px 0}
.pause{display:block;font-family:var(--label);font-size:14px;font-weight:600;background:var(--ink);color:var(--paper);padding:12px 14px;margin:18px 0}
.pause::before{content:"Pause · "}

.sum{width:100%;border-collapse:collapse;font-family:var(--readable);font-size:15px;font-variant-numeric:tabular-nums}
.sum td{padding:7px 0;border-bottom:1px solid #CFC8B8;vertical-align:top}
.sum td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.sum tr.t td{border-top:var(--rule) solid var(--ink);border-bottom:0;font-weight:600}
.sum tr.gapr td{color:var(--accent-text);font-weight:600}
.sum small{display:block;font-family:var(--label);font-size:12px;color:var(--ink-soft);font-weight:400}

.btn{font-family:var(--label);font-weight:600;font-size:14px;min-height:48px;padding:0 18px;border:var(--rule) solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.small{min-height:44px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.choose{display:grid;gap:12px;margin:16px 0}
.pick{display:block;text-align:left;width:100%;background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:14px 16px;cursor:pointer;font:inherit;font-size:16px;color:var(--ink);border-radius:0}
.pick strong{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;display:block;line-height:1}
.pick em{font-family:var(--label);font-style:normal;font-size:12px;display:block;margin:4px 0;color:var(--eyebrow-ink);text-transform:uppercase;letter-spacing:.04em}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink-1);border-color:var(--ink-1)}

.checks{list-style:none;margin:0;padding:0;font-family:var(--readable);font-size:15px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #CFC8B8}
.checks li:last-child{border-bottom:0}
.checks .m{font-family:var(--label);font-weight:600;min-width:1.6em}
.checks li.no{color:var(--accent-text)}
.checks li.soft{color:var(--ink-soft)}

/* The document: plain, printable, two pages like the fund's model budget. */
.docs{overflow-x:auto;margin:18px 0}
.doc{background:#fff;color:#111;border:var(--rule) solid var(--ink);padding:18px 14px;margin:0 0 14px;font-family:var(--readable);font-size:12px;line-height:1.4;font-variant-numeric:tabular-nums;min-width:520px}
.doc .kind{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase;color:var(--display-ink)}
.doc .kind small{display:block;font-family:var(--label);font-size:11px;font-weight:600;color:#111;letter-spacing:.04em;margin-top:6px;text-transform:none}
.doc .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.doc .head .meta{text-align:right;max-width:55%}
.doc h4{font-family:var(--label);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px;border-bottom:2px solid #111;padding-bottom:3px}
.doc table{width:100%;border-collapse:collapse}
.doc th{font-family:var(--label);font-size:10px;font-weight:600;text-align:right;padding:3px 0 3px 8px;white-space:nowrap;border-bottom:1px solid #111}
.doc td{padding:4px 0 4px 8px;border-bottom:1px solid #ddd;text-align:right;vertical-align:top}
.doc th:first-child,.doc td:first-child{text-align:left;padding-left:0}
.doc td.l,.doc th.l{text-align:left}
.doc td .n{display:block;font-size:10px;color:#555;font-style:italic}
.doc tr.t td{border-top:2px solid #111;border-bottom:0;font-weight:600}
.doc tr.g td{font-weight:600;color:#B8293A}
.doc .k2{color:#555}
.doc .empty{color:#9a958b;font-style:italic}
.doc .foot{margin-top:12px;font-size:10px;color:#555}

.linkbox{font-family:var(--label);font-size:12px;word-break:break-all;background:var(--paper);border:1px solid var(--ink);padding:8px;max-height:5.5em;overflow:auto;display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--rule-heavy) solid var(--ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.bar .live{flex:1;text-align:center;font-family:var(--label);font-size:13px;line-height:1.2}
nav.bar .live b{display:block;font-family:var(--display);font-weight:900;font-size:24px}
nav.bar .live b.warn{color:var(--accent-text)}
footer{padding:28px 0 0;font-family:var(--label);font-size:12px;color:var(--ink-soft)}

#printarea{display:none}
@media print{
  @page{margin:12mm}
  body{padding:0;background:#fff}
  .wrap,nav.bar{display:none!important}
  #printarea{display:block}
  #printarea .doc{border:0;margin:0;padding:0;min-width:0}
  #printarea .doc + .doc,#printarea .reopen{break-before:page}
  #printarea .reopen{font-family:var(--readable);font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Our project budget: the team's pieces */
.who{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.who button.out{background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.chip{flex:1 1 140px;border:var(--rule) solid var(--ink);background:var(--paper-raised);padding:8px 10px;font-family:var(--readable);font-size:14px;line-height:1.3}
.chip b{display:block;font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1;margin-bottom:2px;color:var(--display-ink)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cardhead h2{margin:0}
.role{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.05;text-transform:uppercase;color:var(--display-ink);margin:10px 0 6px}
.kbar{display:flex;height:18px;border:1px solid var(--ink);background:#E6DFD0;margin:0 0 6px}
.kbar span{display:block;height:100%}
.k-lead{background:var(--ink-1)}
.k-prod{background:var(--ink)}
.k-make{background:var(--ink-2)}
.k-res{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,var(--paper) 2px 6px)}
.k-host{background:repeating-linear-gradient(135deg,var(--ink-1) 0 3px,var(--paper) 3px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--label);font-size:12px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i,.sw{display:inline-block;width:16px;height:16px;border:1px solid var(--ink);vertical-align:-2px}
.panel h2 .sw{margin-right:8px;width:18px;height:18px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.kinds button{min-height:44px;font-family:var(--label);font-size:13px;font-weight:600;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:0}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fold{border-top:1px solid #CFC8B8;margin-top:10px}
.fold summary{font-family:var(--label);font-size:13px;font-weight:600;min-height:44px;display:flex;align-items:center;cursor:pointer}
.fold div{font-size:16px}
.ro{display:flex;align-items:center;justify-content:flex-end;min-height:44px;font-family:var(--label);font-size:15px;font-variant-numeric:tabular-nums}
.choose.two{grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
.pick.small{padding:10px 12px;font-size:14px;line-height:1.3}
.pick.small strong{font-size:20px;margin-bottom:4px}
.meter span.past{background:var(--ink-2)}
nav.bar .live .ck{display:block;font-size:12px;color:var(--ink-soft)}
</style>

<style>
/* Expanding Practices: the card, the team code */
.situ{background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:16px;margin:16px 0}
.situ .no{font-family:var(--label);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--eyebrow-ink)}
.situ h2{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;margin:4px 0 10px;color:var(--display-ink)}
.situ p{font-size:17px;margin:0 0 10px}
.situ .half{font-style:italic;border-top:1px solid #CFC8B8;padding-top:10px;margin:10px 0 0}
.situ .half + .half{border-top:0;padding-top:0}
.cards{display:grid;gap:10px;margin:12px 0}
.cards .pick strong{font-size:22px}
.frame{width:100%;border-collapse:collapse;font-family:var(--readable);font-size:15px}
.frame td{padding:6px 0;border-bottom:1px solid #CFC8B8;vertical-align:top}
.frame td:first-child{font-family:var(--label);font-size:13px;padding-right:12px;white-space:nowrap}
.kindtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.parth{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pname{font-family:var(--readable);font-weight:600;font-size:18px;border:0;border-bottom:var(--rule) solid var(--ink);background:transparent;padding:6px 0;margin:6px 0 4px}
.pname.empty{border-bottom:var(--rule) dashed var(--accent-text)}
.pname::placeholder{color:var(--accent-text);font-style:italic;font-weight:400;opacity:1}
.time{width:100%;border-collapse:collapse;font-family:var(--readable);font-size:14px;font-variant-numeric:tabular-nums}
.time th{font-family:var(--label);font-size:11px;font-weight:600;text-align:right;padding:4px 0 4px 8px;border-bottom:var(--rule) solid var(--ink)}
.time td{padding:7px 0 7px 8px;border-bottom:1px solid #CFC8B8;text-align:right;vertical-align:top}
.time th:first-child,.time td:first-child{text-align:left;padding-left:0}
.time td small{display:block;font-family:var(--label);font-size:11px;color:var(--ink-soft)}
.time td.over{color:var(--accent-text);font-weight:600}
.time td.under{color:var(--ink-1);font-weight:600}
.time tr.t td{border-top:var(--rule) solid var(--ink);border-bottom:0;font-weight:600}
.qrbox{background:#fff;border:var(--rule-heavy) solid var(--ink);padding:12px;margin:12px 0;display:flex;justify-content:center}
.qrbox svg{width:100%;max-width:420px;height:auto;display:block}
.given{border:var(--rule) dashed var(--ink-1);padding:10px;margin:10px 0;background:var(--paper)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.chips .chip{grid-column:span 2;min-width:0}
.chips.n4 .chip{grid-column:span 3}
.chips.n5 .chip:nth-child(n+4){grid-column:span 3}
.payrow{border-bottom:1px solid #CFC8B8;padding:8px 0}
.payrow .top2{display:flex;justify-content:space-between;gap:10px;font-family:var(--readable);font-size:15px;margin-bottom:6px}
.payrow .top2 span:last-child{font-family:var(--label);white-space:nowrap}
.payers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.payers button{min-height:44px;font-family:var(--label);font-size:12px;font-weight:600;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:0;padding:2px 6px;overflow:hidden;text-overflow:ellipsis}
.payers button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pickrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.phline{color:var(--accent-text);font-style:italic}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.facts.one{grid-template-columns:1fr}
.facts > div{border-top:var(--rule-heavy) solid var(--ink);padding-top:6px}
.facts .k{display:block;font-family:var(--label);font-size:13px}
.facts .v{display:block;font-family:var(--display);font-weight:900;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.rateline{border:var(--rule) solid var(--ink);background:var(--paper-raised);padding:10px 12px;margin:14px 0;font-family:var(--readable);font-size:15px}
.rateline .fold{margin-top:6px}
.receipt{background:#fff;border:1px solid #CFC8B8;box-shadow:0 2px 0 #CFC8B8;padding:18px 14px 22px;margin:22px 4px;font-family:var(--label);
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x;
  mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x}
.receipt h2{font-family:var(--label);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;text-align:center;border-bottom:1px dashed #111;padding-bottom:8px;margin:0 0 6px}
.receipt .time td,.receipt .time th{font-family:var(--label)}
.receipt .time tr.t td{border-top:1px dashed #111}
.given .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--label);font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="studio">a Situated Studio</span>
    <button class="toggle" id="readable" aria-pressed="false">Readable mode</button>

/* ---------- checks: each says what is missing ---------- */
function checks(c){
  var w=S.w,list=[];
  var empty=[];w.parts.forEach(function(p){if(!p.l.length||p.l.some(function(l){return l.m==="none";}))empty.push(partTitle(p));});
  list.push(["Every part has someone who does it",!empty.length,empty.join(", ")]);
  var noname=w.mem.filter(function(m){return !m.n||!(m.days>0);}).length;
  var noH=[];w.parts.forEach(function(p){if(p.l.some(function(l){return l.m!=="none"&&!(l.h>0);}))noH.push(partTitle(p));});
  list.push(["Everyone has a first name and days a week",!noname]);
  list.push(["Every part has hours",!noH.length,noH.join(", "),"soft"]);
  var unnamed=w.parts.filter(function(p){return !p.n;}).map(partTitle);
  list.push(["Every part has a name of our own",!unnamed.length,unnamed.join(", "),"soft"]);
  var off=[];c.mem.forEach(function(m,i){if(!m.commit||Math.abs(m.h-m.commit)>m.commit*0.1)off.push(first(i));});
  list.push(["Everyone's hours match the time they give",!off.length,off.join(", "),"soft"]);
  list.push(["Someone in the team spends hours leading",c.leadH>0]);
  list.push([FUND.name+" pays at most "+eur(FUND.max),!c.over,c.over?eur(c.over)+" over: move lines to the others":""]);
  list.push(["Others pay at least "+FUND.min+"%",c.pct>=FUND.min,Math.round(c.pct)+"% now"+(c.short?", "+eur(c.short)+" short":"")]);
  var t0=w.oth[0]||{n:""};
  list.push(["Our third partner is named, and pays for something",!!(t0.n&&c.by.o0>0)]);
  /* the hourly cap holds for every paid hour: the team rate, members' own rates and people paid from outside the team */
  var high=[];
  if(w.same){if(w.rate>FUND.cap)high.push("our team rate");}
  else w.mem.forEach(function(m,i){if(m.r>FUND.cap)high.push(mname(i));});
  eachLine(function(l,p){if(l.m==="paid"&&l.r>FUND.cap&&high.indexOf(lineName(l))<0)high.push(lineName(l));if(l.m==="none"&&!w.same&&w.rate>FUND.cap&&high.indexOf("parts nobody has yet")<0)high.push("parts nobody has yet");});
  list.push(["Every rate is within "+FUND.name+"'s "+rate(FUND.cap)+" an hour",!high.length,high.join(", ")]);
  if(w.ink&&w.ink.length){var noval=w.ink.filter(function(x){return !(x.a>0);}).map(function(x){return x.d||"something given";});
    list.push(["Everything given has a value",!noval.length,noval.join(", "),"soft"]);}
  list.push(["We made the project statement our own",!!w.sent&&w.sent!==card().start,"","soft"]);
  list.push(["We said why it deserves fair support",!!w.why,"","soft"]);
  return list;
}
function checkList(list){var bad=list.some(function(x){return !x[1];});return '<ul class="checks">'+list.map(function(x){var ok=!!x[1],cls=ok?"":(x[3]==="soft"?"soft":"no");return '<li class="'+cls+'"><span class="m">'+(ok?"✓":x[3]==="soft"?"?":"–")+'</span><span>'+x[0]+(!ok&&x[2]?' <i>('+esc(x[2])+')</i>':'')+'</span></li>';}).join("")+'</ul>'+(bad?'<p class="note">– to fix · ? to talk over</p>':'');}

}
function timeTable(c){
  var w=S.w;
  return '<table class="time"><thead><tr><th>Who</th><th>Committed</th><th>In the budget</th><th>Difference</th></tr></thead><tbody>'+
   w.mem.map(function(m,i){var x=c.mem[i],d=x.h-x.commit,off=x.commit&&Math.abs(d)>x.commit*0.1;
     return '<tr><td>'+esc(mname(i))+'<small>'+esc(x.role.txt)+'</small></td><td>'+hrs(x.commit)+'<small>'+daysTxt(m.days)+'</small></td><td>'+hrs(x.h)+'<small>'+eur(x.amt)+'</small></td><td class="'+(off?(d>0?"over":"under"):"")+'">'+(Math.abs(d)<1?"–":(d>0?"+":"−")+hrs(Math.abs(d)))+'<small>'+(!off?"in balance":d>0?"over":"not budgeted")+'</small></td></tr>';}).join("")+
   '<tr class="t"><td>The team</td><td>'+hrs(c.teamCommit)+'</td><td>'+hrs(c.teamH)+'</td><td>'+(Math.abs(c.teamH-c.teamCommit)<1?"–":(c.teamH>c.teamCommit?"+":"−")+hrs(Math.abs(c.teamH-c.teamCommit)))+'</td></tr></tbody></table>';

function flagsHtml(c){
  var w=S.w,o=[];

    if(max/c.leadH>=CARRY_SHARE&&w.mem.length>1)o.push('<p class="note"><b>'+esc(first(top))+' does '+Math.round(max/c.leadH*100)+'% of the leading</b>, '+hrs(max)+'. Visible now, and in the budget.</p>');}

function forList(code){
  var w=S.w,t=[];

   '<table style="margin-top:10px"><tr class="t"><td>Total project costs</td><td>'+eur(c.total)+'</td></tr></table>'+
   '<h4>Who we are</h4><table><tbody>'+w.mem.map(function(m,i){var x=c.mem[i];return '<tr><td>'+esc(mname(i))+'<span class="n">'+esc([m.d,m.b].filter(Boolean).join(" · "))+'</span></td><td class="l">'+esc(x.role.txt)+'</td><td>'+hrs(x.h)+' of '+hrs(x.commit)+'</td><td>'+eur(x.amt)+'</td></tr>';}).join("")+'</tbody></table></div>';
  var src=payers().filter(function(p){return p[0]!=="f";}).map(function(p){var f=forList(p[0]);return (c.by[p[0]]||f.length)?'<tr><td class="l">'+esc(p[2])+(f.length?'<span class="n">for '+esc(f.join(", "))+'</span>':'')+'</td><td>'+eur(c.by[p[0]])+'</td></tr>':'';}).join("");
  var given=[];eachLine(function(l,p){if(l.m==="free"&&lineAmt(l)>0)given.push('<tr><td class="l">'+esc(lineName(l))+'<span class="n">'+esc(partTitle(p))+', '+l.h+' h</span></td><td>'+eur(lineAmt(l))+'</td></tr>');});
  if(w.ink)w.ink.forEach(function(x){if(x.a>0)given.push('<tr><td class="l">'+v(x.d,"something given")+(x.g?'<span class="n">from '+esc(x.g)+'</span>':'')+'</td><td>'+eur(x.a)+'</td></tr>');});
  var lf=forList("f");
  var p2='<div class="doc">'+head.replace("%K%","Coverage plan")+
   '<h4>Paid by others</h4><table><tbody>'+(src||'<tr><td><span class="empty">Nobody else yet</span></td><td></td></tr>')+'<tr class="t"><td>Paid by others, '+Math.round(c.pct)+'% of the total</td><td>'+eur(c.others)+'</td></tr></tbody></table>'+
   '<table style="margin-top:10px"><tbody><tr><td class="l">Asked from '+FUND.name+(lf.length?'<span class="n">for '+esc(lf.join(", "))+'</span>':'')+'</td><td>'+eur(c.fund)+'</td></tr>'+
   (c.over?'<tr class="g"><td>Over '+FUND.name+'\'s '+eur(FUND.max)+'</td><td>'+eur(c.over)+'</td></tr>':'')+
   '<tr class="t"><td>Total project costs</td><td>'+eur(c.total)+'</td></tr></tbody></table>'+
   (given.length?'<h4>Given, not in euros</h4><table><tbody>'+given.join("")+'<tr class="t"><td>What the project is really worth</td><td>'+eur(c.total+c.given)+'</td></tr></tbody></table>':'')+
   (w.why?'<h4>Why it\'s worth it</h4><p>'+esc(w.why)+'</p>':'')+
   '<p class="foot">A practice budget from Economic Cultures at Expanding Practices, Nieuwe Instituut, 21 November 2026. '+FUND.name+' is made up; its rules follow the Stimuleringsfonds\' good practice: at most '+eur(FUND.max)+', others pay at least '+FUND.min+'%. A Situated Studio, CC BY 4.0.</p></div>';
  return p1+p2;
}

/* ---------- the team's code ---------- */
function qrSvg(text){
  try{
    var cut=text.indexOf("#s=Z"),q=qrcode(0,"L");
    if(cut>0){q.addData(text.slice(0,cut+3),"Byte");q.addData(text.slice(cut+3),"Alphanumeric");}else q.addData(text,"Byte");q.make();
    var n=q.getModuleCount(),m=4,d="";
    for(var r=0;r<n;r++)for(var col=0;col<n;col++)if(q.isDark(r,col))d+="M"+(col+m)+" "+(r+m)+"h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" shape-rendering="crispEdges" role="img" aria-label="Our team\'s code"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';
  }catch(e){return '<p class="note">This team\'s budget is too long for a code. Shorten a few texts, or send the link.</p>';}
}

/* ---------- outputs ---------- */
function update(){
  var c=calc(),w=S.w,vals={teamCommit:hrs(c.teamCommit),meetH:hrs(meetH()),
    commitHow:w.mem.length+" of us, "+w.mem.reduce(function(s,m){return s+(m.days||0);},0)+" days a week together × "+w.months+" months × 4.33 weeks × 8 h",meetHow:w.months+" months × 4.33 weeks ÷ every "+w.meet.e+" weeks × "+w.meet.h+" h"};
  w.parts.forEach(function(p,pi){p.l.forEach(function(l,li){vals["lx"+pi+"_"+li]=(l.h||0)+" h × "+rate(lineRate(l))+" = "+eur(lineAmt(l));});});
  document.querySelectorAll("[data-o]").forEach(function(el){
    var k=el.getAttribute("data-o");
    if(vals[k]!==undefined)el.textContent=vals[k];
    else if(k.indexOf("pa:")===0){var pth=k.slice(3),amt=pth==="meet"?c.meet:/^mat\./.test(pth)?Math.round(get(pth+".a")||0):lineAmt(get(pth));el.textContent=eur(amt);}
    else if(k==="matTotal")el.textContent=eur(c.mat);
    else if(k==="matPct")el.textContent=(c.total?Math.round(c.mat/c.total*100):0)+"% of the project";
    else if(k==="timeTable")el.innerHTML=timeTable(c);
    else if(k==="flags")el.innerHTML=flagsHtml(c);
    else if(k==="costTable")el.innerHTML=costTable(c);
    else if(k==="cover")el.innerHTML=coverHtml(c);
    else if(k==="checks")el.innerHTML=checkList(checks(c));
    else if(k==="congrats")el.innerHTML=checks(c).every(function(x){return !!x[1];})?'<p class="done">Well done, '+esc(teamName())+'! Every euro has a payer, and everyone\'s time is in it. Take a moment to enjoy it together.</p>':'';
    else if(k==="doc")el.innerHTML=docHtml(c);
    else if(k==="sendhint")el.textContent=sendHint();
  });
  var live=document.getElementById("live"),ck=checks(c),ok=ck.filter(function(x){return !!x[1];}).length;
  if(S.step===0)live.innerHTML="";
  else if(S.step<=2)live.innerHTML='Our time<b>'+hrs(c.teamCommit)+'</b>';
  else if(S.step===3)live.innerHTML='In the budget / committed<b'+(Math.abs(c.teamH-c.teamCommit)>c.teamCommit*0.1?' class="warn"':'')+'>'+Math.round(c.teamH).toLocaleString("en-GB")+' / '+hrs(c.teamCommit)+'</b>';
  else if(S.step===4)live.innerHTML=FUND.name+'<b'+(c.over?' class="warn"':'')+'>'+eur(c.fund)+'</b><span class="ck'+(c.pct<FUND.min?' warn':'')+'">others pay '+Math.round(c.pct)+'%</span>';
  else live.innerHTML='Checks<b>'+ok+' of '+ck.length+'</b>';
  persist();
}
function shareUrl(){var base="";try{base=location.origin+location.pathname;}catch(e){}return base+"?card="+S.w.card+"#s="+(CODE&&codeFor===json()?CODE:encodeSync());}
function refreshLink(){
  if(!S.w)return;
  var u=shareUrl();
  document.querySelectorAll('[data-o="link"]').forEach(function(el){el.textContent=u;el.setAttribute("href",u);});
  document.querySelectorAll('[data-o="qr"]').forEach(function(el){if(el.getAttribute("data-for")!==u){el.innerHTML=qrSvg(u);el.setAttribute("data-for",u);}});
}
function pdfHint(){var u="";try{u=navigator.userAgent||"";}catch(e){}
  if(/Android/i.test(u))return "On Android the print screen opens: choose “Save as PDF”, then tap the round PDF button.";
  if(/iPhone|iPad|iPod/i.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))return "On an iPhone the print screen opens: tap the share icon at the top, then “Save to Files”.";
  return "In the print window, choose “Save as PDF” as the printer.";}
function sendPanel(){
  if(!sendOpen())return "";
  var h='<div class="panel send"><h2>The live report</h2>';
  if(SENDST.state==="done")return h+'<p class="status ok">'+esc(SENDST.msg)+'</p><div class="row"><button class="btn small" data-act="sendask">Changed something? Send it again</button></div></div>';
  if(!SENDST.open)return h+'<p class="flag" data-o="sendhint">'+sendHint()+'</p>'+'<div class="row"><button class="btn primary" data-act="sendask">Send to the live report</button></div></div>';
  h+='<div class="consent"><p><b>What happens when you send</b></p><ul>'+
    '<li>We receive your team\'s code: your team name, your first names, your budget and your claim, exactly as in this tool.</li>'+
    '<li>It shows in the live report on the screen in this room, beside the other teams.</li>'+
    '<li>Afterwards the live report stays on our archive as the record of today, under CC BY 4.0, credited to your team.</li>'+
    '<li>Nothing else is sent, and nothing about this phone.</li></ul></div>';
  if(SENDST.state==="sending")return h+'<p class="status">Sending…</p></div>';
  if(SENDST.state==="fail")h+='<p class="status">'+esc(SENDST.msg)+' <a href="'+esc(formUrl())+'" target="_blank" rel="noopener">Send it through our form instead</a>, or show your code to the host.</p>';
  return h+'<div class="row"><button class="btn primary" data-act="sendgo">Send</button><button class="btn" data-act="sendno">Not now</button></div></div>';
}
function sendHint(){return String(S.w.why||"").trim()?"":"Write your claim above first: it is what the room reads.";}
function sendGo(){
  if(!SEND.endpoint){SENDST.open=false;SENDST.state="";render(false);try{window.open(formUrl(),"_blank","noopener");}catch(e){location.href=formUrl();}return;}
  SENDST.state="sending";render(false);
  var body=new URLSearchParams({edition:SEND.edition,link:shareUrl(),website:""});
  fetch(SEND.endpoint,{method:"POST",body:body}).then(function(r){return r.json();}).then(function(res){
    if(res&&res.ok){SENDST.state="done";SENDST.msg=res.duplicate?"It was already in the live report. Look up at the screen!":"It is in the live report. Look up at the screen!";}
    else{SENDST.state="fail";SENDST.msg=res&&res.error==="closed"?"Sending is closed for today.":"That did not go through.";}
  }).catch(function(){SENDST.state="fail";SENDST.msg="That did not go through.";}).then(function(){render(false);});
}
function canShare(){try{return typeof navigator.share==="function";}catch(e){return false;}}

/* ---------- render & events ---------- */
var stage=document.getElementById("stage");
function render(focus){
  var y=window.scrollY,openF=[];stage.querySelectorAll("details[open] summary").forEach(function(s){openF.push(s.textContent);});
  uid=0;stage.innerHTML=STEPS[S.step].r();
  stage.querySelectorAll("details summary").forEach(function(s){if(openF.indexOf(s.textContent)>=0)s.parentNode.open=true;});
  document.getElementById("progress").innerHTML='<span>'+(S.step?"Step "+S.step+" of "+LAST+" · "+STEPS[S.step].t:"Start")+'</span><span>'+(S.step>=2?esc(teamName()):(S.chosen?"Situation "+S.w.card:""))+'</span>';
  document.getElementById("back").style.visibility=S.step===0?"hidden":"";
  var n=document.getElementById("next");n.textContent=S.step===0?"Begin":S.step===LAST?"Save as PDF":"Next";n.disabled=S.step===0&&!S.chosen;
  update();refreshLink();
  if(focus){var h=stage.querySelector("h1");if(h)h.focus({preventScroll:true});window.scrollTo(0,0);}else window.scrollTo(0,y);
}
function go(d){S.step=Math.min(LAST,Math.max(0,S.step+d));render(true);}
document.getElementById("next").onclick=function(){if(S.step===0&&!S.chosen)return;if(S.step<LAST)go(1);else printDoc();};
document.getElementById("back").onclick=function(){if(S.step>0)go(-1);};
function onEdit(e){
  var t=e.target,p=t.getAttribute("data-p");if(!p)return;
  var val;
  if(t.getAttribute("data-n")){var n=parseFloat(String(t.value).replace(",","."));val=isFinite(n)&&n>=0?n:0;
    if(p==="months")val=Math.min(24,Math.max(0,Math.round(val)));if(/\.days$/.test(p))val=Math.min(5,val);
    if(p==="meet.e")val=Math.min(8,Math.max(0,Math.round(val)));if(p==="meet.h")val=Math.min(8,val);if(/\.h$/.test(p))val=Math.min(5000,val);}
  else val=String(t.value).slice(0,+(t.getAttribute("maxlength"))||200);
  set(p,val);
  update();
  if(/^mem\.\d+\.n$/.test(p)){var h=t.closest(".card");if(h){var h2=h.querySelector("h2");if(h2)h2.textContent=val||"Member";}}
  if(/^(parts\.\d+\.n|mat\.\d+\.d)$/.test(p))t.classList.toggle("empty",!val);
  if(p==="reg.n"){var r3=t.closest(".panel");if(r3){var hs=r3.querySelectorAll("h3");if(hs[1])hs[1].textContent="2 · "+(val||"Our regional backer");}}
}
stage.addEventListener("input",onEdit);
stage.addEventListener("change",function(e){var p=e.target.getAttribute("data-p");if(p&&/^(oth\.\d+\.n|reg\.n|mat\.\d+\.d)$/.test(p))render(false);});
function removeOther(i){
  var w=S.w;if(w.oth.length<2)return;w.oth.splice(i,1);
  var fix=function(p){if(p==="o"+i)return "f";if(/^o\d$/.test(p)&&+p.charAt(1)>i)return "o"+(+p.charAt(1)-1);return p;};
  eachLine(function(l){l.pay=fix(l.pay);});w.mat.forEach(function(m){m.pay=fix(m.pay);});w.meet.pay=fix(w.meet.pay);
}
function removeMember(i){
  var w=S.w;w.mem.splice(i,1);
  eachLine(function(l){if(l.m===i){l.m="none";}else if(isMember(l)&&l.m>i)l.m--;});
}
function hasEdits(){return S.chosen&&json()!==JSON.stringify((function(){var keep=S.w,st=S.step;S.w=preset(keep.card);var j=pack();S.w=keep;j.t=st;return j;})());}
stage.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a,w=S.w;
  if((a=b.getAttribute("data-card"))){
    if(S.chosen&&a===w.card){return;}
    if(hasEdits()&&PENDING!==a){PENDING=a;render(false);return;}
    PENDING="";S.w=preset(a);S.chosen=true;S.step=0;render(true);return;}
  if((a=b.getAttribute("data-who"))){
    var pr=a.split("."),l=w.parts[+pr[0]].l[+pr[1]],who=/^\d+$/.test(pr[2])?+pr[2]:pr[2];
    l.m=who;if(!isMember(l)&&who!=="none"&&!l.r)l.r=w.same?w.rate:55;
    render(false);return;}
  if((a=b.getAttribute("data-kind"))){var kp=a.split(".");w.parts[+kp[0]].k=kp[1];render(false);return;}
  if((a=b.getAttribute("data-addl"))){var pt=w.parts[+a];if(pt.l.length<8)pt.l.push(Ln("none",0));render(false);return;}
  if((a=b.getAttribute("data-dell"))){var dl=a.split(".");w.parts[+dl[0]].l.splice(+dl[1],1);render(false);return;}
  if((a=b.getAttribute("data-delpart"))){w.parts.splice(+a,1);render(false);return;}
  if((a=b.getAttribute("data-delm"))){if(w.mem.length>MIN_MEMBERS)removeMember(+a);render(false);return;}
  if((a=b.getAttribute("data-del"))){var d=a.split(".");w[d[0]].splice(+d[1],1);render(false);return;}
  if((a=b.getAttribute("data-pay"))){var pp=a.split("|");if(pp[0]==="meet")w.meet.pay=pp[1];else{var o=get(pp[0]);if(o)o.pay=pp[1];}render(false);return;}
  if((a=b.getAttribute("data-roll"))){var oi=+a,cur=w.oth[oi].n,used=w.oth.map(function(x){return x.n;}),pool=(card().partners||[]).filter(function(x){return used.indexOf(x[0])<0;});
    if(!pool.length)pool=(card().partners||[]).filter(function(x){return x[0]!==cur;});
    if(pool.length)w.oth[oi].n=pool[Math.floor(Math.random()*pool.length)][0];render(false);return;}
  if((a=b.getAttribute("data-delo"))){removeOther(+a);render(false);return;}
  if((a=b.getAttribute("data-same"))){w.same=a==="1";if(!w.same)w.mem.forEach(function(m){m.r=m.r||w.rate;});render(false);return;}
  a=b.getAttribute("data-act");
  if(a==="addm"){if(w.mem.length<MAX_MEMBERS){var nm=Mb();nm.r=w.rate;w.mem.push(nm);}render(false);return;}
  if(a==="addpart"){if(w.parts.length<MAX_PARTS)w.parts.push({n:"",k:"",ph:"",l:[Ln("none",0)]});render(false);return;}
  if(a==="addmat"){if(w.mat.length<20)w.mat.push({d:"",a:0,ph:"",pay:"f"});render(false);return;}
  if(a==="addoth"){if(w.oth.length<MAX_OTHERS)w.oth.push({n:""});render(false);return;}
  if(a==="addink"){if(w.ink&&w.ink.length<MAX_INK)w.ink.push({d:"",a:0,g:""});render(false);return;}
  if(a==="sendask"){SENDST.open=true;SENDST.state="";render(false);return;}
  if(a==="sendno"){SENDST.open=false;SENDST.state="";render(false);return;}
  if(a==="sendgo"){sendGo();return;}
  if(a==="print"){printDoc();return;}
  if(a==="share"){try{navigator.share({title:document.title,url:shareUrl()}).catch(function(){});}catch(err){}return;}
  if(a==="copy"){var url=shareUrl(),m=stage.querySelector('[data-o="copyMsg"]');
    var fallback=function(){var box=stage.querySelector('[data-o="link"]');var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Selected. Copy it from your phone's menu.";};
    try{navigator.clipboard.writeText(url).then(function(){m.textContent="Copied.";},fallback);}catch(err){fallback();}}
});
function printDoc(){
  var u=shareUrl();
  document.getElementById("printarea").innerHTML=docHtml(calc())+
    '<div class="reopen"><p><b>Reopen this in the tool.</b> Tap the link below. Everything lives in the link, not with us.</p><p><a class="linkbox" href="'+esc(u)+'">Open it in the tool, as we left it</a></p></div>';
  var prev=document.title;
  try{document.title="Budget "+teamName()+" situation "+S.w.card;}catch(e){}
  var done=function(){document.title=prev;window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  try{window.print();}catch(err){}
}
var rb=document.getElementById("readable");
try{if(localStorage.getItem("ec-readable")==="1"){document.body.classList.add("readable");rb.setAttribute("aria-pressed","true");}}catch(e){}
rb.onclick=function(){var on=document.body.classList.toggle("readable");rb.setAttribute("aria-pressed",String(on));try{localStorage.setItem("ec-readable",on?"1":"0");}catch(e){}};

window.__budget={get S(){return S;},calc:calc,checks:checks,preset:preset,pack:pack,shareUrl:shareUrl,meetH:meetH,commitOf:commitOf};
load().then(function(){},function(){if(!S.w)S.w=preset("1");}).then(function(){if(!S.w)S.w=preset("1");render(false);refreshLink();});
})();
