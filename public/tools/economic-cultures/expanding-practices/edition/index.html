<style>
/* The tools' sheet: riso on paper, baseline Blue + Bright Red and black. Teams carry their pawn colour; payers stay in ink. */
:root{
  --paper:#F7F3EA; --paper-raised:#FBF8F1; --ink:#111111; --ink-soft:#4A463F; --line:#CFC8B8;
  --ink-1:#0078BF; --ink-2:#F15060; --eyebrow-ink:#3D5588; --accent-text:#B8293A;

  --readable:"Atkinson Hyperlegible Next",Verdana,sans-serif;
  --label:"Atkinson Hyperlegible Mono","Courier New",monospace;
  --p1:#0078BF; --p2:#FF48B0; --p3:#FF6C2F; --p4:#F15060; --p5:#765BA7;
  --pay-f:#111111; --pay-r:#8C8472; --pay-o:#FBF8F1;
  --u:clamp(10px,0.8vw,22px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--text);font-size:calc(var(--u)*1.6);line-height:1.45;padding:calc(var(--u)*2.4) calc(var(--u)*3) calc(var(--u)*6)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
.eyebrow{font-family:var(--display);font-weight:800;font-size:calc(var(--u)*1.5);letter-spacing:.08em;color:var(--eyebrow-ink);text-transform:uppercase;margin:0 0 calc(var(--u)*.6)}

.over h1,.over .ghost{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*6.4);line-height:.88;text-transform:uppercase;margin:0;mix-blend-mode:multiply;text-wrap:balance}
.over h1{position:relative;color:var(--ink-1)}
.over .ghost{position:absolute;left:.05em;top:.05em;color:var(--ink-2)}
.label{font-family:var(--label);font-size:calc(var(--u)*1.1);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.soft{color:var(--ink-soft)}

/* ---------- the frame ---------- */
.head{display:grid;grid-template-columns:1.25fr 1fr;gap:calc(var(--u)*3);align-items:end;border-bottom:3px solid var(--ink);padding-bottom:calc(var(--u)*1.6)}
.purpose{font-size:calc(var(--u)*1.7);margin:0}

.tally small{display:block;font-family:var(--label);font-weight:400;font-size:calc(var(--u)*1.1);text-transform:none;letter-spacing:0;color:var(--ink-soft);margin-top:calc(var(--u)*.5)}
.stance{display:grid;grid-template-columns:1.6fr 1fr;gap:calc(var(--u)*3);align-items:end;margin:calc(var(--u)*2) 0}
.stance .big{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*4);line-height:.95;text-transform:uppercase;color:var(--ink-1);margin:0;text-wrap:balance}
.stance .fine{font-size:calc(var(--u)*1.45);line-height:1.45;margin:0;border-left:3px solid var(--ink);padding-left:calc(var(--u)*1.2)}

/* ---------- the plans side by side ---------- */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*30),1fr));gap:calc(var(--u)*1.6);margin:calc(var(--u)*1.2) 0 calc(var(--u)*2.4)}

.plan .team{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*2.6);line-height:.95;text-transform:uppercase}
.plan .claim{font-size:calc(var(--u)*1.7);line-height:1.3;flex:1}
.plan .k{display:block;font-family:var(--label);font-size:calc(var(--u)*.95);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:calc(var(--u)*.3)}
.plan .makes .m{display:block;font-family:var(--readable);font-weight:600;font-size:calc(var(--u)*1.35);line-height:1.3}
.plan .funds{border-top:2px solid var(--ink);padding-top:calc(var(--u)*.6)}
.plan .funds .f{display:flex;justify-content:space-between;gap:calc(var(--u)*1);font-family:var(--readable);font-size:calc(var(--u)*1.25);line-height:1.35;border-bottom:1px solid var(--line);padding:calc(var(--u)*.2) 0}
.plan .funds .f b{font-family:var(--label);font-weight:600}

.plan .k .nb{color:var(--accent-text)}
.plan .who{font-family:var(--label);font-size:calc(var(--u)*1.05);color:var(--ink-soft)}
.plan .open{font-family:var(--label);font-size:calc(var(--u)*1.05)}

/* ---------- the money bar (one scale for every plan, so they compare) ---------- */

.bar .mark.right span{left:auto;right:4px}

.bar .seg{height:100%;border:2px solid var(--ink);margin-left:-2px;flex:none}
.bar .seg:first-child{margin-left:0}

.bar .seg.r{background:var(--pay-r)}
.bar .seg.o{background:var(--pay-o)}

.bar .mark.p20{border-left:2px solid var(--ink-1)}
.bar .mark.p20 span{color:var(--ink-1);top:auto;bottom:0;transform:translateY(100%)}
.bar .scale{display:flex;justify-content:space-between;font-family:var(--label);font-size:calc(var(--u)*.9);color:var(--ink-soft);margin-top:calc(var(--u)*1.3)}

/* ---------- the four points ---------- */
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.6);border-top:3px solid var(--ink);padding-top:calc(var(--u)*1.4)}
.point .no{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*4);line-height:.8;color:var(--ink-1)}
.point h2{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*2.4);line-height:.95;text-transform:uppercase;margin:calc(var(--u)*.4) 0 calc(var(--u)*.6)}
.point p{font-size:calc(var(--u)*1.45);margin:0 0 calc(var(--u)*.5)}
.point .ev{font-family:var(--readable);font-size:calc(var(--u)*1.3)}
.strip{position:relative;height:calc(var(--u)*5);margin:calc(var(--u)*1.6) 0 calc(var(--u)*.4);border-bottom:2px solid var(--ink)}
.strip .dot{position:absolute;bottom:0;width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:var(--pc);border:2px solid var(--ink);transform:translate(-50%,50%)}
.strip .tick{position:absolute;bottom:0;top:0;border-left:2px dashed var(--ink-2)}
.strip .tick span{position:absolute;top:0;left:4px;font-family:var(--label);font-size:calc(var(--u)*.95);color:var(--accent-text);white-space:nowrap}

/* ---------- one plan, full size ---------- */
.full{display:none}
body.open .overview{display:none}
body.open .full{display:block}
.full .top{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(var(--u)*3);border-top:calc(var(--u)*1.2) solid var(--pc);padding-top:calc(var(--u)*1.6)}
.full .claim{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*4.4);line-height:.95;text-transform:uppercase;margin:calc(var(--u)*.6) 0 calc(var(--u)*1.2)}
.full .stmt{font-size:calc(var(--u)*1.8);font-style:italic;margin:0 0 calc(var(--u)*1.2)}
.people{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.8)}
.person{border:2px solid var(--ink);background:var(--paper-raised);padding:calc(var(--u)*.5) calc(var(--u)*.9);font-family:var(--readable);font-size:calc(var(--u)*1.25);line-height:1.3}

.sec{margin-top:calc(var(--u)*2)}
.sec h3{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*2.1);text-transform:uppercase;margin:0 0 calc(var(--u)*.5);line-height:1}
.sec h3 .no{color:var(--ink-1);margin-right:.3em}
.payers{display:grid;gap:calc(var(--u)*.4);margin-top:calc(var(--u)*2.4)}
.payer{display:grid;grid-template-columns:calc(var(--u)*1.6) 1fr auto;gap:calc(var(--u)*.8);align-items:baseline;font-family:var(--readable);font-size:calc(var(--u)*1.25)}
.payer i{display:inline-block;width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border:2px solid var(--ink);vertical-align:middle}
.payer .amt{font-family:var(--label);white-space:nowrap}
.payer small{display:block;color:var(--ink-soft);font-size:.85em}
table.work{border-collapse:collapse;width:100%;font-family:var(--readable);font-size:calc(var(--u)*1.2)}
table.work th{font-family:var(--label);font-weight:600;font-size:calc(var(--u)*.95);text-transform:uppercase;text-align:left;padding:calc(var(--u)*.3) calc(var(--u)*.4);border-bottom:2px solid var(--ink)}
table.work td{padding:calc(var(--u)*.35) calc(var(--u)*.4);border-bottom:1px solid var(--line);vertical-align:middle}
table.work td.h{width:15%}
table.work .cellbar{height:calc(var(--u)*1.1);background:var(--ink);display:block;margin-bottom:2px}
table.work .cellbar.lead{background:var(--ink-1)}
table.work .n{font-family:var(--label);font-size:calc(var(--u)*.95)}
table.work tr.nobody td:first-child{color:var(--accent-text);font-weight:600}
table.work tr.nobody .cellbar{background:repeating-linear-gradient(45deg,var(--ink-2) 0 4px,var(--paper) 4px 9px)}
table.work tr.gives .cellbar{background:repeating-linear-gradient(90deg,var(--ink-soft) 0 6px,transparent 6px 8px)}
.reading{font-family:var(--readable);font-size:calc(var(--u)*1.3);margin-top:calc(var(--u)*.6)}
ul.open{list-style:none;padding:0;margin:0}
ul.open li{font-family:var(--readable);font-size:calc(var(--u)*1.35);padding:calc(var(--u)*.5) 0 calc(var(--u)*.5) calc(var(--u)*2);border-bottom:1px solid var(--line);position:relative}
ul.open li::before{content:"";position:absolute;left:0;top:calc(var(--u)*.85);width:calc(var(--u)*1);height:calc(var(--u)*1);border:2px solid var(--accent-text)}
ul.open li.held::before{background:var(--ink);border-color:var(--ink)}
.question{border:3px solid var(--ink);background:var(--paper-raised);padding:calc(var(--u)*1) calc(var(--u)*1.2);font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*1)}
.given{font-family:var(--readable);font-size:calc(var(--u)*1.3)}
.given b{font-family:var(--label)}

/* ---------- the host's line ---------- */
.status{position:fixed;left:0;right:0;bottom:0;display:flex;gap:calc(var(--u)*1);align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--paper);border-top:2px solid var(--ink);padding:calc(var(--u)*.5) calc(var(--u)*3);font-family:var(--label);font-size:calc(var(--u)*1)}
.status .ctl{display:flex;gap:calc(var(--u)*.5)}
.status button{min-height:44px;min-width:44px;border:2px solid var(--ink);background:var(--paper-raised);padding:0 calc(var(--u)*.9);cursor:pointer;font-family:var(--label);font-size:calc(var(--u)*1);font-weight:600}
.status button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.status .warn{color:var(--accent-text)}
body.screen .status{opacity:.15;transition:opacity .3s}
body.screen .status:hover,body.screen .status:focus-within{opacity:1}

@media (max-width:820px){
  :root{--u:10px}
  body{font-size:16px;padding:16px 16px 120px}
  .head,.stance,.full .top{grid-template-columns:1fr}
  .points{grid-template-columns:1fr}
  .over h1,.over .ghost{font-size:48px}
  .status{padding:6px 12px}
}
@media (max-width:480px){.points{grid-template-columns:1fr}}
.stance.close{margin-top:calc(var(--u)*3);border-top:3px solid var(--ink);padding-top:calc(var(--u)*1.6)}
@media (prefers-reduced-motion:reduce){.plan.new{animation:none}}
</style>

 1:{title:"What the harbour remembers",lead:"The harbour is becoming a neighbourhood.",body:"Most of the people who worked here have already moved on; a few stay until the end. What should the new neighbourhood carry on from them?",

function canZip(){return typeof CompressionStream==="function"&&typeof DecompressionStream==="function"&&typeof Response==="function";}
function json(){return JSON.stringify(pack());}

function encodeZip(){

/* For the code: the deflated bytes in the QR's own 43-letter alphabet, about a quarter denser than base64 */
var A43="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$*+-./:",CH=[0,2,3,5,6,8,9,11,12];
function canBig(){return typeof BigInt==="function";}
function to43(bytes){var out="";for(var i=0;i<bytes.length;i+=8){var n=Math.min(8,bytes.length-i),v=BigInt(0);
  for(var j=0;j<n;j++)v=v*BigInt(256)+BigInt(bytes[i+j]);var s="";for(var k=0;k<CH[n];k++){s=A43.charAt(Number(v%BigInt(43)))+s;v=v/BigInt(43);}out+=s;}return out;}
function from43(str){var bytes=[],i=0;while(i<str.length){var left=str.length-i,n=8;while(n>0&&CH[n]>left)n--;if(!n)throw new Error("bad");
  var v=BigInt(0);for(var k=0;k<CH[n];k++){var d=A43.indexOf(str.charAt(i+k));if(d<0)throw new Error("bad");v=v*BigInt(43)+BigInt(d);}
  var chunk=[];for(var j=0;j<n;j++){chunk.unshift(Number(v%BigInt(256)));v=v/BigInt(256);}bytes=bytes.concat(chunk);i+=CH[n];}return new Uint8Array(bytes);}
function decode(code){
  if(code.charAt(0)==="Z"){
    var st=new Blob([from43(code.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(st).text().then(function(t){unpack(JSON.parse(t));});
  }
  if(code.charAt(0)==="z"){
    var stream=new Blob([unb64u(code.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(function(t){unpack(JSON.parse(t));});

  if(code.charAt(0)==="j"){unpack(JSON.parse(new TextDecoder().decode(unb64u(code.slice(1)))));return Promise.resolve();}

function eur(n){return (n<0?"−€":"€")+Math.abs(Math.round(n||0)).toLocaleString("en-GB");}
function rate(n){return "€"+Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function hrs(n){return Math.round(n||0).toLocaleString("en-GB")+" h";}

function rateOf(i){var w=S.w;return w.same?w.rate:(w.mem[i]?w.mem[i].r:0);}
function lineRate(l){return isMember(l)?rateOf(l.m):l.m==="none"?S.w.rate:l.r;}
function lineAmt(l){return Math.round(l.h*lineRate(l));}
function meetH(){var w=S.w;return w.meet.e?Math.round(w.months*WEEKS_PER_MONTH/w.meet.e*w.meet.h):0;}
function commitOf(i){return Math.round(S.w.months*WEEKS_PER_MONTH*S.w.mem[i].days*HOURS_PER_DAY);}
function eachLine(fn){S.w.parts.forEach(function(p,pi){p.l.forEach(function(l,li){fn(l,p,pi,li);});});}

function roleOf(i){
  var by={},tot=0;KIND_KEYS.forEach(function(k){by[k]=0;});
  eachLine(function(l,p){if(l.m===i&&by[p.k]!==undefined){by[p.k]+=l.h;tot+=l.h;}});
  var sorted=KIND_KEYS.slice().sort(function(a,b){return by[b]-by[a];}),txt;
  if(!tot)txt="No parts yet";
  else{var top=sorted[0],second=sorted[1];
    if(by.lead/tot>=LEAD_SHARE)txt="Takes a lead role"+(top!=="lead"?", mostly "+kindWord(top):"");
    else txt="Mostly "+kindWord(top)+(by[second]/tot>=ALSO_SHARE&&second!=="lead"?", also "+kindWord(second):"");}
  return {by:by,tot:tot,txt:txt};
}

function calc(){
  var w=S.w,c={team:0,outside:0,nobody:0,nobodyH:0,meet:0,people:0,mat:0,total:0,mem:[],teamCommit:0,teamH:0,leadH:0,givenTime:0,givenInk:0};
  var mh=meetH();
  w.mem.forEach(function(m,i){var commit=commitOf(i),ma=Math.round(mh*rateOf(i));
    c.mem.push({h:mh,amt:ma,commit:commit,role:roleOf(i)});c.meet+=ma;c.teamCommit+=commit;});
  eachLine(function(l,p){
    var a=lineAmt(l);
    if(l.m==="none"){c.nobody+=a;c.nobodyH+=l.h;return;}
    if(isMember(l)){var mm=c.mem[l.m];mm.h+=l.h;mm.amt+=a;c.team+=a;if(p.k==="lead")c.leadH+=l.h;}
    else if(l.m==="paid")c.outside+=a;
    else c.givenTime+=a;
  });
  c.mem.forEach(function(m){c.teamH+=m.h;});
  c.team+=c.meet;
  c.people=c.team+c.outside+c.nobody;
  w.mat.forEach(function(m){c.mat+=Math.round(m.a);});
  c.total=c.people+c.mat;
  if(w.ink)w.ink.forEach(function(x){c.givenInk+=Math.round(x.a);});
  c.given=c.givenTime+c.givenInk;
  c.by={f:0,r:0};w.oth.forEach(function(_,i){c.by["o"+i]=0;});
  var add=function(p,a){if(c.by[p]===undefined)p="f";c.by[p]+=a;};
  eachLine(function(l){if(l.m!=="free")add(l.pay,lineAmt(l));});
  add(w.meet.pay,c.meet);
  w.mat.forEach(function(m){add(m.pay,Math.round(m.a));});
  c.fund=c.by.f;c.over=Math.max(0,c.fund-FUND.max);
  c.others=c.total-c.fund;
  c.pct=c.total?c.others/c.total*100:0;
  c.short=Math.max(0,Math.ceil(FUND.min/100*c.total)-c.others);
  return c;
}

/* ---------- small helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch];});}
function pct(n){return Math.round(n)+"%";}
function clean(t){return String(t||"").replace(/\s*\(name it\)\s*$/,"");}
function partName(p){return p.n||clean(p.ph)||"A part of their own";}
function matName(m){return m.d||clean(m.ph)||"A cost";}
function teamName(pl){return pl.w.team||"Team "+PAWN_NAME[pl.w.card];}
function firsts(w){return w.mem.map(function(m,i){return m.n?m.n.split(" ")[0]:"Member "+(i+1);});}
function list(a){a=a.filter(Boolean);if(a.length<2)return a.join("");return a.slice(0,-1).join(", ")+" and "+a[a.length-1];}

/* ---------- reading one link into a plan, with the tool's own unpack() and calc() ---------- */
function codeOf(link){var t=String(link||"").trim(),i=t.indexOf("#s=");return i<0?"":t.slice(i+3).replace(/\s+/g,"");}
function readPlan(link){
  var code=codeOf(link);if(!code)return Promise.reject(new Error("not a team link"));
  return decode(code).then(function(){var w=JSON.parse(JSON.stringify(S.w)),c=calc();return describe(w,c,code);});
}
function describe(w,c,code){
  var C=CARDS[w.card],pl={w:w,c:c,code:code,C:C};
  /* who pays for what: titles of the lines each payer carries */
  var pays={};function add(p,title,amt){if(!amt)return;(pays[p]=pays[p]||{amt:0,items:[]}).amt+=amt;if(pays[p].items.indexOf(title)<0)pays[p].items.push(title);}
  w.parts.forEach(function(p){p.l.forEach(function(l){if(l.m!=="free")add(c.by[l.pay]!==undefined?l.pay:"f",partName(p),lineAmt(l));});});
  if(c.meet)add(c.by[w.meet.pay]!==undefined?w.meet.pay:"f","Team meetings",c.meet);
  w.mat.forEach(function(m){add(c.by[m.pay]!==undefined?m.pay:"f",matName(m),Math.round(m.a));});
  pl.pays=pays;
  /* the work by person and kind */
  var rows=w.mem.map(function(m,i){return {name:firsts(w)[i],sub:m.d,by:{},tot:0,kind:"mem"};});
  var outside={name:"Paid, outside the team",by:{},tot:0,kind:"paid"},gives={name:"Gives time",by:{},tot:0,kind:"gives"},nobody={name:"Nobody yet",by:{},tot:0,kind:"nobody"};
  var nobodyParts=[],giverNames=[];
  w.parts.forEach(function(p){p.l.forEach(function(l){
    var r=typeof l.m==="number"?rows[l.m]:l.m==="paid"?outside:l.m==="free"?gives:nobody;if(!r)return;
    r.by[p.k]=(r.by[p.k]||0)+l.h;r.tot+=l.h;
    if(l.m==="none"&&l.h>0&&nobodyParts.indexOf(partName(p))<0)nobodyParts.push(partName(p));
    if(l.m==="free"&&l.nm&&giverNames.indexOf(l.nm)<0)giverNames.push(l.nm);
  });});
  pl.rows=rows.concat([outside,gives,nobody].filter(function(r){return r.tot>0;}));
  pl.nobodyParts=nobodyParts;pl.givers=giverNames;pl.givenH=gives.tot;
  /* who carries the leading */
  var leadBy=rows.map(function(r){return r.by.lead||0;}),leadTot=leadBy.reduce(function(a,b){return a+b;},0),top=0;
  leadBy.forEach(function(h,i){if(h>leadBy[top])top=i;});
  pl.leadShare=leadTot?leadBy[top]/leadTot:0;pl.leadTop=rows[top]?rows[top].name:"";
  pl.leading=!leadTot?"none":pl.leadShare>=CARRY_SHARE?"one":"shared";
  /* the gaps, plainly */
  var open=[];
  if(c.over>0)open.push("Fonds Lef is asked "+eur(c.over)+" more than it can give.");
  if(c.short>0)open.push("Others pay "+pct(c.pct)+" of the total. Fonds Lef asks at least "+FUND.min+"%: "+eur(c.short)+" still to find.");
  if(c.nobodyH>0)open.push(hrs(c.nobodyH)+" of work have nobody beside them yet: "+list(nobodyParts)+".");
  if(pl.leading==="none")open.push("Nobody in the team holds the leading.");
  var gap=c.teamCommit-c.teamH;
  if(gap>40)open.push(hrs(gap)+" of the time the team committed is not in the budget.");
  if(gap<-40)open.push("The budget asks "+hrs(-gap)+" more than the team committed.");
  /* the fund's hourly cap holds for every paid hour (the same rule as the tool's check) */
  var high=[];
  if(w.same){if(w.rate>FUND.cap)high.push("The team rate, "+rate(w.rate)+",");}
  else w.mem.forEach(function(m,i){if(m.r>FUND.cap)high.push(firsts(w)[i]+"'s rate, "+rate(m.r)+",");});
  w.parts.forEach(function(p){p.l.forEach(function(l){if(l.m==="paid"&&l.r>FUND.cap)high.push("The rate for "+(l.nm||"someone paid from outside")+", "+rate(l.r)+",");});});
  high.forEach(function(h){open.push(h+" is above "+FUND.name+"'s "+rate(FUND.cap)+" an hour.");});
  pl.capOk=!high.length;
  pl.open=open;pl.holds=c.over===0&&c.short===0&&c.total>0&&pl.capOk;
  return pl;
}

/* ---------- the money bar: one scale for every plan ---------- */
var SCALE=70000;
function payerLabel(pl,p){var w=pl.w;if(p==="f")return FUND.name;if(p==="r")return w.reg.n||"The regional backer";var i=+p.slice(1);return (w.oth[i]&&w.oth[i].n)||"The third partner";}
function bar(pl,big){
  var c=pl.c,segs=[],fundIn=Math.min(c.fund,FUND.max);
  segs.push(["f",fundIn]);
  if(c.over>0)segs.push(["x",c.over]);
  Object.keys(c.by).forEach(function(k){if(k!=="f"&&c.by[k]>0)segs.push([k==="r"?"r":"o",c.by[k],k]);});
  var given=c.given||0;if(given>0)segs.push(["g",given]);
  var max=Math.max(SCALE,c.total+given),w=function(a){return (a/max*100)+"%";};
  var h='<div class="bar'+(big?" big":"")+'" style="--bh:'+(big?"calc(var(--u)*3.4)":"calc(var(--u)*2.2)")+'"><div class="track" role="img" aria-label="'+esc(barText(pl))+'">'+
    segs.map(function(s){return '<span class="seg '+s[0]+'" style="width:'+w(s[1])+'"></span>';}).join("")+
    '<span class="mark" style="left:'+w(EDITION.alone)+'"><span>'+(big?"€25,000 alone":"€25k alone")+'</span></span>'+
    '<span class="mark right" style="left:'+w(FUND.max)+'"><span>'+(big?"€50,000 together":"€50k together")+'</span></span>'+
    (big?'<span class="mark p20" style="left:'+w(c.total*(1-FUND.min/100))+'"><span>others pay from here: 20%</span></span>':'')+
    '</div>'+(big?'<div class="scale"><span>€0</span><span>'+eur(max)+'</span></div>':'')+'</div>';
  return h;
}
function barText(pl){var c=pl.c;return "Total "+eur(c.total)+". "+FUND.name+" "+eur(c.fund)+", others "+pct(c.pct)+"."+(c.given?" Given, not in euros: "+eur(c.given)+".":"");}

/* ---------- the overview ---------- */
var PLANS=[],ROUND="all",SEEN={},FIRST=true,OPEN=null;
function shown(){return PLANS.filter(function(p){return ROUND==="all"||String(p.round)===ROUND;});}
function renderOverview(){
  var ps=shown(),people=ps.reduce(function(a,p){return a+p.w.mem.filter(function(m){return m.n;}).length;},0);
  var h='<header class="head"><div><p class="eyebrow">'+esc(EDITION.series)+' · '+esc(EDITION.where)+'</p>'+
    '<div class="over"><div class="ghost" aria-hidden="true">'+esc(EDITION.title)+'</div><h1>'+esc(EDITION.title)+'</h1></div></div>'+
    '<div><p class="purpose">'+esc(EDITION.purpose)+'</p>'+
    '<p class="tally">'+(ps.length?ps.length+(ps.length===1?" team":" teams")+" · "+people+" people · "+ps.length+(ps.length===1?" budget":" budgets")+" for Rotterdam":"Waiting for the first budget")+
    '</p></div></header>';
  h+='<section class="stance"><p class="big">'+esc(EDITION.statement)+'</p><p class="fine">'+esc(EDITION.fine)+'</p></section>';
  h+=ps.length?'<section class="plans" aria-label="The plans">'+ps.map(planCard).join("")+'</section>':'<div class="empty">Scan a team\'s code, paste its link in the form, and its plan appears here.</div>';
  h+=points(ps);
  document.getElementById("overview").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".plan"),function(b){b.addEventListener("click",function(){openPlan(b.getAttribute("data-k"));});});
}
function makes(pl){return pl.w.parts.filter(function(p){return p.k==="make"&&p.n&&p.n.trim();}).map(function(p){return p.n.trim();});}
function shares(pl){
  var c=pl.c,out=[],keys=["f","r"].concat(Object.keys(c.by).filter(function(k){return /^o/.test(k);}));
  keys.forEach(function(k){var a=k==="f"?Math.min(c.fund,FUND.max):c.by[k];if(a>0)out.push([payerLabel(pl,k),a]);});
  if(c.over>0)out.push(["Nobody yet",c.over]);
  /* whole percentages that add up to 100: largest remainder */
  var raw=out.map(function(x){return c.total?x[1]/c.total*100:0;}),fl=raw.map(Math.floor),left=100-fl.reduce(function(a,b){return a+b;},0);
  raw.map(function(r,i){return [r-fl[i],i];}).sort(function(p,q){return q[0]-p[0];}).slice(0,Math.max(0,left)).forEach(function(p){fl[p[1]]++;});
  return out.map(function(x,i){return {name:x[0],pct:fl[i],none:x[0]==="Nobody yet"};});
}
function planCard(pl){
  var w=pl.w,c=pl.c,isNew=!FIRST&&!SEEN[pl.key],mk=makes(pl);
  return '<button class="plan'+(isNew?" new":"")+'" data-k="'+esc(pl.key)+'" style="--pc:'+PAWN[w.card]+'"><span class="band"></span><span class="in">'+
    '<span class="label">Situation '+w.card+' · '+esc(pl.C.title)+'</span>'+
    '<span class="team">'+esc(teamName(pl))+'</span>'+
    '<span class="claim">'+(w.why?esc(w.why):'<span class="soft">No claim written.</span>')+'</span>'+
    (mk.length?'<span class="makes"><span class="k">What they make</span>'+mk.map(function(m){return '<span class="m">'+esc(m)+'</span>';}).join("")+'</span>':'')+
    '<span class="funds"><span class="k">'+eur(c.total)+' budgeted '+(pl.holds?'(balanced)':'<span class="nb">(not balanced yet)</span>')+', paid by</span>'+
      shares(pl).map(function(x){return '<span class="f'+(x.none?" none":"")+'"><span>'+esc(x.name)+'</span><b>'+pct(x.pct)+'</b></span>';}).join("")+'</span>'+
    '<span class="who">'+esc(w.mem.map(function(m,i){return firsts(w)[i]+(m.d?", "+m.d:"");}).join(" · "))+'</span>'+
    '</span></button>';
}
function points(ps){
  if(!ps.length)return "";
  var n=ps.length,
    asks=ps.map(function(p){return p.c.fund;}),overAlone=asks.filter(function(a){return a>EDITION.alone;}).length,
    hTot=0,hNamed=0,hNobody=0,hGiven=0,carried=0,holds=0,pcts=[],partners=[],given=0,givenWhat=[];
  ps.forEach(function(p){
    p.rows.forEach(function(r){hTot+=r.tot;if(r.kind==="nobody")hNobody+=r.tot;else hNamed+=r.tot;if(r.kind==="gives")hGiven+=r.tot;});
    if(p.leading==="one")carried++;if(p.holds)holds++;pcts.push(p.c.pct);
    p.w.oth.forEach(function(o){if(o.n&&partners.indexOf(o.n)<0)partners.push(o.n);});
    given+=p.c.given||0;(p.w.ink||[]).forEach(function(x){if(x.a>0)givenWhat.push(x.d.toLowerCase());});
  });
  var strip='<div class="strip">'+ps.map(function(p){return '<span class="dot" title="'+esc(teamName(p))+'" style="left:'+(p.c.fund/60000*100)+'%;--pc:'+PAWN[p.w.card]+'"></span>';}).join("")+
    '<span class="tick" style="left:'+(EDITION.alone/60000*100)+'%"><span>alone</span></span><span class="tick" style="left:'+(FUND.max/60000*100)+'%"><span>together</span></span></div>';
  var lo=Math.min.apply(null,asks),hi=Math.max.apply(null,asks);
  return '<section class="points" aria-label="What the plans show">'+
   pt(1,"Together the ceiling rises","Alone, Fonds Lef gives one maker at most €25,000. As partners, up to €50,000.",
     (overAlone===n?"Every team":overAlone+" of "+n+" teams")+" asked Fonds Lef for more than one person could: "+(lo===hi?eur(lo):"from "+eur(lo)+" to "+eur(hi))+".",strip)+
   pt(2,"All the work has a name","Leading, organising, researching, making and gathering: each lands with someone, by name.",
     hNamed.toLocaleString("en-GB")+" of "+hrs(hTot)+" have a name beside them"+(hNobody?"; "+hrs(hNobody)+" still say nobody yet":"")+". "+
     (carried?"In "+carried+" of "+n+" teams one person carries most of the leading.":"In every team the leading is shared."))+
   pt(3,"Every euro has a payer","Fonds Lef is the main backer. The other backers must pay at least 20% between them, each for its own purpose.",
     "Here they pay "+(n>1?"between "+pct(Math.min.apply(null,pcts))+" and "+pct(Math.max.apply(null,pcts)):pct(pcts[0]))+". "+(holds===n?"Every budget":holds+" of "+n+" budgets")+" reach"+(holds===1&&n>1?"es":"")+" the 20%.")+
   '</section>'+
   '<section class="stance close"><p class="big">'+esc(EDITION.conclusion)+'</p><p class="fine">'+esc(EDITION.conclusionFine)+'</p></section>';
}
function pt(no,title,body,ev,extra){return '<div class="point"><div class="no">'+no+'</div><h2>'+title+'</h2><p>'+body+'</p>'+(extra||"")+(ev?'<p class="ev">'+esc(ev)+'</p>':'')+'</div>';}

/* ---------- one plan, full size ---------- */
function renderFull(pl){
  var w=pl.w,c=pl.c,KN=KINDS.map(function(k){return k[0];});
  var maxCell=1;pl.rows.forEach(function(r){KN.forEach(function(k){maxCell=Math.max(maxCell,r.by[k]||0);});});
  var payers=Object.keys(pl.pays).sort(function(a,b){return a==="f"?-1:b==="f"?1:a==="r"?-1:b==="r"?1:0;}).map(function(p){
    var sw=p==="f"?"var(--pay-f)":p==="r"?"var(--pay-r)":"var(--pay-o)";
    return '<div class="payer"><i style="background:'+sw+'"></i><span><b>'+esc(payerLabel(pl,p))+'</b><small>pays for '+esc(list(pl.pays[p].items.map(function(t){return t.charAt(0).toLowerCase()+t.slice(1);})))+'</small></span><span class="amt">'+eur(pl.pays[p].amt)+'</span></div>';
  }).join("");
  if(c.given)payers+='<div class="payer"><i style="background:repeating-linear-gradient(90deg,transparent 0 6px,var(--line) 6px 8px)"></i><span><b>Given, not in euros</b><small>'+esc(list((w.ink||[]).filter(function(x){return x.a>0;}).map(function(x){return x.d.toLowerCase()+", from "+x.g.replace(/^(The|A|An) /,function(m){return m.toLowerCase();});})))+(pl.givenH?(w.ink&&w.ink.some(function(x){return x.a>0;})?"; ":"")+hrs(pl.givenH)+" of time from "+esc(list(pl.givers)||"people outside the team"):"")+'</small></span><span class="amt">'+eur(c.given)+'</span></div>';
  var work='<table class="work"><thead><tr><th>Who</th>'+KINDS.map(function(k){return '<th>'+k[1]+'</th>';}).join("")+'</tr></thead><tbody>'+
    pl.rows.map(function(r){return '<tr class="'+r.kind+'"><td><b>'+esc(r.name)+'</b>'+(r.sub?' <span class="soft">'+esc(r.sub)+'</span>':'')+'</td>'+
      KN.map(function(k){var v=r.by[k]||0;return '<td class="h">'+(v?'<span class="cellbar'+(k==="lead"?" lead":"")+'" style="width:'+(v/maxCell*100)+'%"></span><span class="n">'+hrs(v)+'</span>':'')+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table>';
  var reading=pl.leading==="one"?esc(pl.leadTop)+" holds "+pct(pl.leadShare*100)+" of the leading hours. The lead is a role, not a title. Is it shared and budgeted?":
    pl.leading==="shared"?"The leading is shared: nobody carries more than "+pct(pl.leadShare*100)+" of it.":"Nobody holds the leading yet.";
  var h='<div class="top" style="--pc:'+PAWN[w.card]+'"><div>'+
    '<p class="eyebrow">Situation '+w.card+' · '+esc(pl.C.title)+' · round '+pl.round+'</p>'+
    '<div class="over"><div class="ghost" aria-hidden="true">'+esc(teamName(pl))+'</div><h1>'+esc(teamName(pl))+'</h1></div>'+
    '<p class="claim">'+(w.why?esc(w.why):'No claim written.')+'</p>'+
    '<p class="stmt">'+esc(w.sent)+'</p>'+
    '<div class="people">'+w.mem.map(function(m,i){return '<span class="person"><b>'+esc(firsts(w)[i])+'</b>'+esc([m.d,m.b].filter(Boolean).join(" · "))+'</span>';}).join("")+'</div>'+
    '<div class="sec"><h3>Who does the work</h3>'+work+'<p class="reading">'+reading+'</p></div>'+
    '</div><div>'+
    '<div class="sec" style="margin-top:0"><h3>Who pays</h3>'+bar(pl,true)+'<div class="payers">'+payers+'</div>'+
    '<p class="reading">'+eur(c.total)+' in all, '+(w.same?'at '+rate(w.rate)+' an hour for everyone':'at each member\'s own rate')+'. '+FUND.name+' '+eur(c.fund)+'; others '+pct(c.pct)+'.'+'</p></div>'+
    '<div class="sec"><h3>Still open</h3><ul class="open">'+(pl.open.length?pl.open.map(function(o){return '<li>'+esc(o)+'</li>';}).join(""):'<li class="held">Every euro has a payer, and the work is named.</li>')+'</ul>'+
    '<div class="question"><span class="label">The question this situation asks</span><br>'+esc(EDITION.questions[w.card]||"")+'</div></div>'+
    '</div></div>';
  document.getElementById("full").innerHTML=h;
}
function openPlan(k){
  var pl=PLANS.filter(function(p){return p.key===k;})[0];if(!pl){closePlan();return;}
  OPEN=k;renderFull(pl);document.body.classList.add("open");
  try{history.replaceState(null,"",location.pathname+location.search+"#"+encodeURIComponent(k));}catch(e){}
  window.scrollTo(0,0);
}
function closePlan(){OPEN=null;document.body.classList.remove("open");try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
function step(d){var ps=shown();if(!ps.length)return;var i=-1;ps.forEach(function(p,j){if(p.key===OPEN)i=j;});openPlan(ps[(i+d+ps.length)%ps.length].key);}

/* ---------- reading the sheet ---------- */
function parseCSV(t){var rows=[],row=[],f="",q=false;for(var i=0;i<t.length;i++){var ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else if(ch==='"')q=true;else if(ch===","){row.push(f);f="";}else if(ch==="\n"){row.push(f);rows.push(row);row=[];f="";}else if(ch!=="\r")f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}return rows;}
var params=new URLSearchParams(location.search),DEMO=params.has("demo")||FORCE_DEMO,SHEET=params.get("sheet")||EDITION.sheet;
if(params.get("round")==="1"||params.get("round")==="2")ROUND=params.get("round");
if(params.has("screen"))document.body.classList.add("screen");
var LAST_OK=null,BAD=0,BUSY=false;
function fetchRows(){
  if(DEMO)return Promise.resolve(SAMPLES.map(function(s,i){return ["sample "+(i+1),s.link,String(s.round)];}));
  return fetch("https://docs.google.com/spreadsheets/d/"+encodeURIComponent(SHEET)+"/gviz/tq?tqx=out:csv&_="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("sheet "+r.status);return r.text();}).then(function(t){return parseCSV(t).slice(1);});
}
function read(){
  if(BUSY)return;BUSY=true;
  fetchRows().then(function(rows){
    var bad=0,chain=Promise.resolve(),byKey={},order=[];
    rows.forEach(function(r){var link=r[1],round=/2/.test(r[2]||"")?2:1;
      chain=chain.then(function(){return readPlan(link).then(function(pl){
        pl.round=round;pl.key=pl.w.card+"-"+(pl.w.team||firsts(pl.w).join("+")).toLowerCase().replace(/[^a-z0-9+]+/g,"-");
        if(!byKey[pl.key])order.push(pl.key);byKey[pl.key]=pl;   /* a later scan of the same team replaces the earlier one */
      },function(){bad++;});});
    });
    return chain.then(function(){
      PLANS=order.map(function(k){return byKey[k];}).sort(function(a,b){return a.round-b.round||a.w.card-b.w.card;});
      BAD=bad;LAST_OK=new Date();render();
      PLANS.forEach(function(p){SEEN[p.key]=true;});FIRST=false;
    });
  }).catch(function(){state(true);}).then(function(){BUSY=false;});
}
function render(){
  renderOverview();
  if(OPEN){var still=PLANS.some(function(p){return p.key===OPEN;});if(still)renderFull(PLANS.filter(function(p){return p.key===OPEN;})[0]);else closePlan();}
  state(false);
}
function state(failed){
  var t=LAST_OK?LAST_OK.toLocaleTimeString("en-GB"):"–";
  document.getElementById("state").innerHTML=(DEMO?"Sample plans (demo)":"Live from the team-link sheet")+" · read "+t+" · "+PLANS.length+(PLANS.length===1?" plan":" plans")+
    (BAD?' · <span class="warn">'+BAD+(BAD===1?" row is":" rows are")+" not a team link</span>":"")+
    (failed?' · <span class="warn">the sheet could not be read; showing what was read last</span>':"");
}
Array.prototype.forEach.call(document.querySelectorAll("[data-round]"),function(b){b.addEventListener("click",function(){
  ROUND=b.getAttribute("data-round");Array.prototype.forEach.call(document.querySelectorAll("[data-round]"),function(x){x.setAttribute("aria-pressed",String(x===b));});
  if(OPEN&&!shown().some(function(p){return p.key===OPEN;}))closePlan();renderOverview();});});
Array.prototype.forEach.call(document.querySelectorAll("[data-round]"),function(x){x.setAttribute("aria-pressed",String(x.getAttribute("data-round")===ROUND));});
document.getElementById("reload").addEventListener("click",read);
document.addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="Escape")closePlan();else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);else if(e.key==="r"||e.key==="R")read();
});
read();
var want=decodeURIComponent((location.hash||"").slice(1));
if(want){var t0=setInterval(function(){if(PLANS.length){clearInterval(t0);openPlan(want);}},300);setTimeout(function(){clearInterval(t0);},8000);}
if(!DEMO)setInterval(read,10000);
})();
</script>
</body>
</html>
