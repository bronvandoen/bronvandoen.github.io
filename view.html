<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Working notes · Bron van Doen</title>
<!-- Temporary reader. Reads posts/posts.json and posts/<slug>/index.md. Delete when the real working-notes front end exists; the posts stay as they are. -->
<style>
  :root { --bg:#F7F3EA; --ink:#111111; --muted:#5E5A52; --accent:#3D5588; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1C1D20; --ink:#F1EFEA; --muted:#A3A19B; --accent:#9DB6E6; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.6 system-ui, sans-serif; }
  main { max-width:38rem; margin:0 auto; padding:32px 16px 64px; }
  a { color:var(--accent); }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 .25rem; }
  h2 { font-size:1.3rem; margin:2rem 0 .5rem; }
  .meta, .site { color:var(--muted); font-size:.9rem; margin:0 0 1.5rem; }
  .site { margin-bottom:2rem; }
  img { max-width:100%; height:auto; border-radius:6px; }
  ul.posts { list-style:none; padding:0; margin:0; }
  ul.posts li { margin:0 0 1.5rem; }
  ul.posts a { font-size:1.2rem; font-weight:600; text-decoration:none; }
  ul.posts p { margin:.2rem 0 0; color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <p class="site"><a href="view.html">Bron van Doen · working notes</a></p>
  <div id="out">Loading…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function parse(text) {
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text), meta = {}, body = text;
    if (m) {
      body = m[2];
      m[1].split(/\r?\n/).forEach(function (l) { var i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
    }
    return { meta: meta, body: body };
  }
  function get(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r; }); }
  function fail(e) { out.textContent = 'Could not load: ' + e.message; }

  var slug = new URLSearchParams(location.search).get('post');
  if (slug && /^[\w-]+$/.test(slug)) {
    get('posts/' + slug + '/index.md').then(function (r) { return r.text(); }).then(function (t) {
      var p = parse(t);
      document.title = (p.meta.title || slug) + ' · Bron van Doen';
      out.innerHTML = '<h1>' + esc(p.meta.title || slug) + '</h1><p class="meta">' + esc(p.meta.date || '') + (p.meta.project ? ' · ' + esc(p.meta.project) : '') + (p.meta.voices ? ' · ' + esc(p.meta.voices) : '') + '</p><div id="body"></div>';
      var body = document.getElementById('body');
      body.innerHTML = marked.parse(p.body);
      body.querySelectorAll('img').forEach(function (im) {
        var s = im.getAttribute('src');
        if (s && !/^(https?:|\/|data:)/.test(s)) im.src = 'posts/' + slug + '/' + s;
      });
    }).catch(fail);
  } else {
    get('posts/posts.json').then(function (r) { return r.json(); }).then(function (slugs) {
      return Promise.all(slugs.map(function (s) {
        return get('posts/' + s + '/index.md').then(function (r) { return r.text(); }).then(function (t) { return { slug: s, meta: parse(t).meta }; });
      }));
    }).then(function (posts) {
      out.innerHTML = '<ul class="posts">' + posts.map(function (p) {
        return '<li><a href="view.html?post=' + encodeURIComponent(p.slug) + '">' + esc(p.meta.title || p.slug) + '</a>' +
          '<p>' + esc(p.meta.date || '') + (p.meta.project ? ' · ' + esc(p.meta.project) : '') + (p.meta.summary ? ' · ' + esc(p.meta.summary) : '') + '</p></li>';
      }).join('') + '</ul>';
    }).catch(fail);
  }
})();
</script>
</body>
</html>
