<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>From Quote to Invoice</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Same sheet as the hourly-rate tool: riso on paper, baseline Blue + Bright Red and black. */
:root{
  --paper:#F7F3EA; --paper-raised:#FBF8F1; --ink:#111111; --ink-soft:#4A463F;
  --ink-1:#0078BF; --ink-2:#F15060; --display-ink:#0078BF; --eyebrow-ink:#3D5588; --accent-text:#B8293A;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --text:"Source Serif 4",Georgia,serif;
  --readable:"Atkinson Hyperlegible Next",Verdana,sans-serif;
  --label:"Atkinson Hyperlegible Mono","Courier New",monospace;
  --rule:2px; --rule-heavy:3px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body.readable{font-family:var(--readable)}
.wrap{max-width:560px;margin:0 auto}
a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 8px;border-bottom:var(--rule) solid var(--ink)}
.studio{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap;letter-spacing:.01em}
.toggle{font-family:var(--label);font-size:13px;font-weight:600;background:var(--paper-raised);color:var(--ink);border:var(--rule) solid var(--ink);min-height:44px;padding:0 12px;cursor:pointer;border-radius:0}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.progress{font-family:var(--label);font-size:13px;color:var(--ink-soft);padding-top:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;color:var(--eyebrow-ink);text-transform:uppercase;margin:20px 0 6px}
.over{position:relative;margin:0 0 16px}
.over h1,.over .ghost{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,56px);line-height:.9;text-transform:uppercase;margin:0;text-wrap:balance;mix-blend-mode:multiply}
.over h1{position:relative;color:var(--display-ink)}
.over .ghost{position:absolute;left:3px;top:3px;color:var(--ink-2)}
p{margin:0 0 14px}
.lead{font-size:19px}
.note{font-family:var(--label);font-size:13px;color:var(--ink-soft)}
.accent{font-style:italic;color:var(--accent-text)}

.panel{background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:20px 16px;margin:18px 0}
.panel h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;margin:0 0 10px}
.panel h3{font-family:var(--label);font-weight:600;font-size:14px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}

.f{display:block;padding:10px 0;border-bottom:1px solid #CFC8B8}
.f:last-child{border-bottom:0}
.f label,.f .lbl{display:block;font-family:var(--readable);font-weight:600;font-size:16px;line-height:1.3;margin-bottom:6px}
.f .hint{display:block;font-family:var(--readable);font-size:14px;color:var(--ink-soft);line-height:1.4;margin-top:4px}
.f input,.f textarea,.f select,.ln input,.ln select,.row.item input{width:100%;min-height:44px;font-family:var(--readable);font-size:17px;padding:8px 10px;border:var(--rule) solid var(--ink);background:var(--paper);color:var(--ink);-webkit-text-fill-color:var(--ink);border-radius:0}
.f textarea{min-height:88px;resize:vertical;line-height:1.4}
.f input.ex,.f textarea.ex,.ln input.ex,.row.item input.ex{color:#6A655B;-webkit-text-fill-color:#6A655B;border-style:dashed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button,select,textarea{color-scheme:light}

.ln{border:var(--rule) solid var(--ink);background:var(--paper);padding:10px;margin:10px 0}
.ln .row3{display:grid;grid-template-columns:1fr 1.1fr 1.2fr;gap:8px;margin-top:8px}
.ln .mini{display:block;font-family:var(--label);font-size:12px;margin-bottom:2px}
.ln .amt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--label);font-size:14px;font-variant-numeric:tabular-nums}
.ln input[type=number]{text-align:right;font-variant-numeric:tabular-nums}

.totals{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0}
.total{flex:1 1 140px;border-top:var(--rule-heavy) solid var(--ink);padding-top:6px}
.total .k{font-family:var(--label);font-size:13px}
.total .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}

.other{border-left:var(--rule-heavy) solid var(--ink-2);padding:2px 0 2px 12px;margin:16px 0;font-size:16px}
.other b{font-family:var(--label);font-size:13px;display:block}
.fair{border:var(--rule) solid var(--ink-1);padding:10px 12px;margin:16px 0;font-size:16px;background:var(--paper-raised)}
.fair b{font-family:var(--label);font-size:13px;display:block;color:var(--eyebrow-ink);text-transform:uppercase;letter-spacing:.04em}
.pause{display:block;font-family:var(--label);font-size:14px;font-weight:600;background:var(--ink);color:var(--paper);padding:12px 14px;margin:18px 0}
.pause::before{content:"Pause · "}
.round{display:block;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;background:var(--ink-1);color:#fff;padding:10px 14px;margin:18px 0}

.sum{width:100%;border-collapse:collapse;font-family:var(--readable);font-size:15px;font-variant-numeric:tabular-nums}
.sum td{padding:7px 0;border-bottom:1px solid #CFC8B8;vertical-align:top}
.sum td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.sum tr.t td{border-top:var(--rule) solid var(--ink);border-bottom:0;font-weight:600}

.btn{font-family:var(--label);font-weight:600;font-size:14px;min-height:48px;padding:0 18px;border:var(--rule) solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.small{min-height:44px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.choose{display:grid;gap:12px;margin:16px 0}
.pick{display:block;text-align:left;width:100%;background:var(--paper-raised);border:var(--rule-heavy) solid var(--ink);padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink);border-radius:0}
.pick strong{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;display:block;line-height:1}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink-1);border-color:var(--ink-1)}

.checks{list-style:none;margin:0;padding:0;font-family:var(--readable);font-size:15px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #CFC8B8}
.checks li:last-child{border-bottom:0}
.checks .m{font-family:var(--label);font-weight:600;min-width:1.6em}
.checks li.no{color:var(--accent-text)}
.diff{font-family:var(--label);font-size:13px;margin:8px 0;padding:0;list-style:none}
.diff li{padding:3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tag{font-family:var(--label);font-size:12px;border:1px solid var(--ink);padding:2px 6px}
.tag.new{background:var(--ink-1);color:#fff;border-color:var(--ink-1)}

/* The document itself: plain, printable, a template to keep. */
.doc{background:#fff;color:#111;border:var(--rule) solid var(--ink);padding:20px 14px;margin:18px 0;font-family:var(--readable);font-size:13px;line-height:1.45;position:relative;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.doc .kind{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;text-transform:uppercase;color:var(--display-ink)}
.doc .kind small{display:block;font-family:var(--label);font-size:12px;font-weight:600;color:#111;letter-spacing:.04em;margin-top:6px}
.doc .from{text-align:right;min-width:12em}
.doc .from b,.doc .to b{font-size:14px}
.doc .grid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 20px;margin:22px 0 14px;align-items:flex-end}
.doc .to{min-width:12em;flex:1 1 12em}
.doc .meta{border-collapse:collapse}
.doc .meta td{padding:1px 0 1px 10px;vertical-align:top}
.doc .meta td:first-child{white-space:nowrap}
.doc .meta td:first-child{color:#555;padding-left:0}
.doc .for{margin:10px 0 14px}
.doc .for p{margin:0 0 6px}
.doc .k2{font-family:var(--label);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#555;display:block}
.doc table.lines{width:100%;border-collapse:collapse;margin:8px 0}
.doc table.lines th{font-family:var(--label);font-size:11px;font-weight:600;text-align:right;border-bottom:2px solid #111;padding:4px 0 4px 12px;white-space:nowrap}
.doc table.lines th:first-child,.doc table.lines td:first-child{text-align:left;padding-left:0}
.doc table.lines td{padding:6px 0 6px 12px;border-bottom:1px solid #ccc;text-align:right;vertical-align:top}
.doc table.lines td:first-child{white-space:normal}
.doc table.lines td:not(:first-child){white-space:nowrap}
.doc .tot{margin-left:auto;border-collapse:collapse;min-width:60%}
.doc .tot td{padding:3px 0 3px 12px;text-align:right;white-space:nowrap}
.doc .tot tr.g td{border-top:2px solid #111;font-weight:600;font-size:15px;padding-top:6px}
.doc .pay{margin:18px 0 0}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.doc .sign div{border-top:1px solid #111;padding-top:4px;font-size:11px;color:#555}
.doc .foot{border-top:1px solid #111;margin-top:22px;padding-top:6px;font-size:11px;color:#333}
.doc .stamp{position:absolute;right:14px;bottom:30px;transform:rotate(-8deg);font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:3px solid var(--ink-2);padding:2px 10px;opacity:.85;pointer-events:none;mix-blend-mode:multiply}
.doc .empty{color:#9a958b;font-style:italic}

.linkbox{font-family:var(--label);font-size:12px;word-break:break-all;background:var(--paper);border:1px solid var(--ink);padding:8px;max-height:5.5em;overflow:auto;display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--rule-heavy) solid var(--ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.bar .live{flex:1;text-align:center;font-family:var(--label);font-size:13px;line-height:1.2}
nav.bar .live b{display:block;font-family:var(--display);font-weight:900;font-size:24px}
footer{padding:28px 0 0;font-family:var(--label);font-size:12px;color:var(--ink-soft)}

#printarea{display:none}
.fromb{font-family:var(--readable);font-weight:600;margin:4px 0 8px}
.row.item input{flex:1 1 180px;width:auto}
.lab{font-family:var(--readable);font-weight:600}
#printarea .qs h2{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;margin:0 0 6px}
@media print{
  @page{margin:14mm}
  body{padding:0;background:#fff}
  .wrap,nav.bar{display:none!important}
  #printarea{display:block}
  #printarea .doc{border:0;margin:0;padding:0}
  #printarea .reopen{break-before:page;font-family:var(--readable);font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="studio">a Situated Studio</span>
    <button class="toggle" id="readable" aria-pressed="false">Readable mode</button>

  <div class="progress" id="progress"></div>
  <main id="stage" aria-live="polite"></main>
  <footer>Economic Cultures · DAE Blueprints · a prototype by a Situated Studio. Nothing you type leaves this phone.</footer>
</div>
<nav class="bar" aria-label="Steps">
  <div class="in">
    <button class="btn" id="back">Back</button>
    <div class="live" id="live"></div>
    <button class="btn primary" id="next">Next</button>
  </div>
</nav>
<div id="printarea" aria-hidden="true"></div>

<script>
(function(){
"use strict";
var VAT=0.21, LAST=9;

/* ---------- the two examples: invented people, invented numbers ---------- */

 sam:{who:"Sam",line:"Designer and researcher. Does a research assignment for a museum, by the hour.",
  v:{mode:"hours",

  v:{mode:"fee",
   me:{name:"Noor Haddad Objects",person:"Noor Haddad",street:"Werkplaatslaan 12",city:"5611 XX Eindhoven",email:"noor@example.com",kvk:PRACTICE.kvk,vat:PRACTICE.vat,iban:PRACTICE.iban},
   cl:{name:"Mark Jansen",org:"Hotel Het Veld",street:"Veldweg 3",city:"5612 CD Eindhoven",email:"mark@example.org",ref:"PO 4471"},
   br:{what:"Twelve ceramic wall lamps for the hotel lobby.",deadline:"Before the reopening, in two months",incl:"Design, making, and delivery in Eindhoven.",excl:"Installation and electrical work.",

     {d:"Materials: clay, glaze, fittings",q:1,u:"item",p:480,b:2},
     {d:"Transport and delivery",q:1,u:"item",p:90,b:3}]},
   ok:{how:"signed"},
   inv:{no:"2026-001"}}}

function copy(o){return JSON.parse(JSON.stringify(o));}
function fresh(p){
  var v=copy(PEOPLE[p].v);
  v.q.date=today(); v.ok.date=""; v.inv.date=""; v.inv.done=""; v.inv.lines=null;
  return v;
}

/* ---------- state ---------- */
var S={start:"sam",w:fresh("sam"),step:0};
function get(path){return path.split(".").reduce(function(o,k){return o==null?undefined:o[k];},S.w);}
function set(path,val){var ks=path.split("."),o=S.w;for(var i=0;i<ks.length-1;i++){o=o[ks[i]];}o[ks[ks.length-1]]=val;}
function exVal(path){return path.split(".").reduce(function(o,k){return o==null?undefined:o[k];},PEOPLE[S.start].v);}
function isEx(path){var e=exVal(path);return e!==undefined&&String(e)===String(get(path));}

/* The link carries everything. Short form: a compact array, deflated where the browser can, so the link stays short. */
var U3=["hours","days","item"], HOW=["signed","email","spoken"];
function b64u(bytes){var bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}

function unpackLines(a){if(!Array.isArray(a))return null;var o=[];for(var i=0;i+3<a.length;i+=4)o.push({d:a[i],q:a[i+1],u:U3[a[i+2]]||"item",p:a[i+3]});return o;}
function d8(iso){return iso?iso.replace(/-/g,"").slice(2):"";}
function un8(x){return x&&x.length===6?"20"+x.slice(0,2)+"-"+x.slice(2,4)+"-"+x.slice(4,6):"";}
function compact(){
  var w=S.w,m=w.me,c=w.cl,b=w.br,q=w.q;
  var pr=function(k){return m[k]===PRACTICE[k]?0:m[k];};
  return [2,S.start==="noor"?1:0,S.step,w.mode==="fee"?1:0,
    [m.name,m.person,m.street,m.city,m.email,pr("kvk"),pr("vat"),pr("iban")],
    [c.name,c.org,c.street,c.city,c.email,c.ref],[b.what,b.deadline,b.incl,b.excl],
    [q.no,d8(q.date),q.valid,q.term,q.terms,packLines(q.lines)],
    [HOW.indexOf(w.ok.how),d8(w.ok.date)],[w.inv.no,d8(w.inv.date),d8(w.inv.done),packLines(w.inv.lines)],
    (b.items||[]).map(function(it){return [it.id,it.d];}),(q.lines||[]).map(function(l){return l.b||0;})];

function uncompact(a){
  var start=a[1]===1?"noor":"sam",base=fresh(start),m=a[4]||[],c=a[5]||[],b=a[6]||[],q=a[7]||[],ok=a[8]||[],inv=a[9]||[];
  var str=function(x){return x==null?"":String(x).slice(0,300);};
  ["name","person","street","city","email"].forEach(function(k,i){base.me[k]=str(m[i]);});
  ["kvk","vat","iban"].forEach(function(k,i){base.me[k]=m[5+i]===0?PRACTICE[k]:str(m[5+i]);});
  ["name","org","street","city","email","ref"].forEach(function(k,i){base.cl[k]=str(c[i]);});
  ["what","deadline","incl","excl"].forEach(function(k,i){base.br[k]=str(b[i]);});
  base.mode=a[3]===1?"fee":"hours";
  base.q.no=str(q[0]);base.q.date=un8(q[1]);base.q.valid=+q[2]||0;base.q.term=+q[3]||0;base.q.terms=str(q[4]);
  base.q.lines=cleanLines(unpackLines(q[5]))||[];
  if(Array.isArray(a[10])){base.br.items=a[10].slice(0,20).map(function(x){return {id:+x[0]||0,d:str(x[1]).slice(0,120)};}).filter(function(x){return x.id>0;});}
  else base.br.items=[];
  if(Array.isArray(a[11])) base.q.lines.forEach(function(l,i){if(+a[11][i]>0)l.b=+a[11][i];});
  base.ok.how=HOW[ok[0]]||"";base.ok.date=un8(ok[1]);
  base.inv.no=str(inv[0]);base.inv.date=un8(inv[1]);base.inv.done=un8(inv[2]);base.inv.lines=cleanLines(unpackLines(inv[3]));
  S.start=start;S.w=base;S.step=Math.min(LAST,Math.max(0,+a[2]||0));
}
function encodeSync(){return "j"+b64u(new TextEncoder().encode(JSON.stringify(compact())));}
function canZip(){return typeof CompressionStream==="function"&&typeof DecompressionStream==="function"&&typeof Response==="function";}
function encodeZip(){
  var bytes=new TextEncoder().encode(JSON.stringify(compact()));
  var stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Response(stream).arrayBuffer().then(function(buf){return "z"+b64u(new Uint8Array(buf));});
}
function decode(str){
  if(str.charAt(0)==="z"){
    var stream=new Blob([unb64u(str.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(function(t){uncompact(JSON.parse(t));});
  }
  if(str.charAt(0)==="j"){uncompact(JSON.parse(new TextDecoder().decode(unb64u(str.slice(1)))));return Promise.resolve();}
  decodeOld(str); return Promise.resolve();
}
function decodeOld(str){
  var o=JSON.parse(decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((str.length+3)%4)))));
  var base=fresh(o.s===1?"noor":"sam"), w=o.w||{};
  ["me","cl","br","q","ok","inv"].forEach(function(k){ if(w[k]&&typeof w[k]==="object") Object.keys(base[k]).concat(Object.keys(w[k])).forEach(function(f){ if(w[k][f]!==undefined) base[k][f]=w[k][f]; }); });
  if(w.mode==="hours"||w.mode==="fee") base.mode=w.mode;
  base.q.lines=cleanLines(base.q.lines)||[];
  base.inv.lines=cleanLines(base.inv.lines);
  if(!Array.isArray(base.br.items)) base.br.items=[];
  S.start=o.s===1?"noor":"sam"; S.w=base; S.step=Math.min(LAST,Math.max(0,+o.t||0));
}
function cleanLines(a){
  if(!Array.isArray(a)) return null;
  return a.slice(0,20).map(function(l){var o={d:String(l.d||"").slice(0,120),q:Math.max(0,Number(l.q)||0),u:["hours","days","item"].indexOf(l.u)>=0?l.u:"item",p:Math.max(0,Number(l.p)||0)};if(+l.b>0)o.b=+l.b;return o;});
}
var saveTimer=null, CODE="", codeFor="";
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var key=JSON.stringify(compact());
    if(key===codeFor&&CODE) return;
    var store=function(code){
      if(key!==JSON.stringify(compact())) return;
      CODE=code; codeFor=key;
      try{history.replaceState(null,"","#s="+code);}catch(e){}
      try{localStorage.setItem("ec-quote-invoice",code);}catch(e){}
      refreshLink();
    };
    if(canZip()) encodeZip().then(store,function(){store(encodeSync());}); else store(encodeSync());
  },250);
}
function load(){
  var h=""; try{h=location.hash||"";}catch(e){}

  var fromStore=function(){try{var c=localStorage.getItem("ec-quote-invoice");if(c)return tryCode(c).catch(function(){});}catch(e){}return Promise.resolve();};

function syncLines(){

    if(!l) l={d:it.d,q:1,u:S.w.mode==="hours"?"hours":"item",p:0,b:it.id};
    l.d=it.d; return l;
  });
  var free=ls.filter(function(x){return !x.b||!ids[x.b];}).map(function(x){delete x.b;return x;});
  S.w.q.lines=linked.concat(free);
}

function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function sums(lines){
  var sub=0; (lines||[]).forEach(function(l){sub+=r2(l.q*l.p);});
  sub=r2(sub); var vat=r2(sub*VAT); return {sub:sub,vat:vat,tot:r2(sub+vat)};
}

function diffList(){
  var a=S.w.q.lines,b=invLines(),items=[],n=Math.max(a.length,b.length);
  for(var i=0;i<n;i++){
    var x=a[i],y=b[i];
    if(x&&!y) items.push("Removed: "+esc(x.d||"line "+(i+1)));
    else if(!x&&y) items.push("Added: "+esc(y.d||"line "+(i+1))+", "+eur2(r2(y.q*y.p)));
    else{
      var ch=[];
      if(x.d!==y.d) ch.push("description");
      if(x.q!==y.q||x.u!==y.u) ch.push("quantity "+qtyText(x)+" → "+qtyText(y));
      if(x.p!==y.p) ch.push("price "+eur2(x.p)+" → "+eur2(y.p));

  if(s1!==s2) items.push("Total "+eur2(s1)+" → "+eur2(s2));
  return items.length?'<ul class="diff">'+items.map(function(t){return "<li>"+t+"</li>";}).join("")+'</ul>':'<p class="note">Nothing changed since the quote.</p>';
}

   '<span class="tag new">Invoice number</span><span class="tag new">Invoice date</span><span class="tag new">Delivery date</span><span class="tag new">Due date</span><span class="tag new">Quote reference</span></div>'+
   '<div class="panel">'+txt("inv.no","Invoice number","One series, in order: no gaps, no repeats. Your first invoice could be 2026-001.")+
   '<div class="f"><label for="f-inv-date">Invoice date</label><input id="f-inv-date" type="date" data-p="inv.date" value="'+esc(S.w.inv.date)+'"></div>'+
   '<div class="f"><label for="f-inv-done">Work delivered on</label><input id="f-inv-done" type="date" data-p="inv.done" value="'+esc(S.w.inv.done)+'"><span class="hint">'+(S.w.ok.date?"Your client said yes on "+dmy(S.w.ok.date)+". The work was delivered after that.":"After the day your client said yes (step 7).")+'</span></div>'+
   '<table class="sum"><tr><td>Payment term from your quote</td><td>'+out("term")+'</td></tr><tr class="t"><td>Pay before</td><td>'+out("due")+'</td></tr></table></div>'+
   fair("Fair pay","Invoice when the work is delivered, not months later. Being paid on time is part of being paid fairly.");
 }},
 {t:"Check and hand over",r:function(){
   return heading("Step 9","Check and hand over")+
   '<div class="panel"><h2>Everything on it?</h2>'+out("iChecks")+'</div>'+
   out("docI")+
   pause("Swap phones. Client: does this invoice match what you agreed? Ask about anything that surprises you.")+
   '<div class="panel"><h2>Quote and invoice compared</h2>'+out("diff")+'</div>'+
   '<div class="panel"><h2>Questions to take home</h2><p>What did your client not tell you, and when and how could you have asked?</p><p>Did you lower your price before anyone asked you to?</p><p>What would you rather have put in your quote than done for free?</p><p>Has a client ever asked you to do something for free before giving you a proper assignment?</p></div>'+
   '<div class="panel"><h2>Keep it</h2><p class="pause" style="background:var(--accent-text)">Before you close this page, save the PDFs or the link. We don\'t keep anything, so without them it is gone.</p>'+
   '<div class="row"><button class="btn primary" data-act="print" data-what="invoice">Save the invoice as a PDF</button><button class="btn" data-act="print" data-what="quote">Save the quote as a PDF</button></div>'+
   '<p class="note" style="margin-top:12px">Keep the PDF as a template. Put in your real numbers once you have them, and the PRACTICE stamp goes.</p>'+
   '<h3 style="margin-top:16px">Reopen it later</h3><p>This link reopens the tool as you left it. Everything lives in the link, not with us.</p>'+

   '<div class="row" style="margin-top:10px"><button class="btn" data-act="copy">Copy link</button><span class="note" data-o="copyMsg"></span></div></div>'+
   '<p class="note">More to read: <a href="https://fairpracticecode.nl/" target="_blank" rel="noopener">Fair Practice Code</a> · <a href="https://www.kvk.nl/en/" target="_blank" rel="noopener">KVK</a> · <a href="https://www.belastingdienst.nl/" target="_blank" rel="noopener">Belastingdienst</a></p>';
 }}
];

/* ---------- outputs ---------- */
function update(){
  var qs=sums(S.w.q.lines), is=sums(invLines());
  var vals={qsub:eur2(qs.sub),qvat:eur2(qs.vat),qtot:eur2(qs.tot),isub:eur2(is.sub),ivat:eur2(is.vat),itot:eur2(is.tot),
    term:(+S.w.q.term||0)+" days",due:S.w.inv.date?dmy(addDays(S.w.inv.date,+S.w.q.term||0)):"—"};
  S.w.q.lines.forEach(function(l,i){vals["qamt"+i]=eur2(r2(l.q*l.p));});
  (S.w.inv.lines||[]).forEach(function(l,i){vals["iamt"+i]=eur2(r2(l.q*l.p));});
  document.querySelectorAll("[data-o]").forEach(function(el){
    var k=el.getAttribute("data-o");
    if(vals[k]!==undefined) el.textContent=vals[k];
    else if(k==="docQ") el.innerHTML=docHtml("quote");
    else if(k==="docI") el.innerHTML=docHtml("invoice");
    else if(k==="qChecks") el.innerHTML=checkList(quoteChecks());
    else if(k==="iChecks") el.innerHTML=checkList(invoiceChecks());
    else if(k==="diff") el.innerHTML=diffList();
    else if(k==="okNote") el.textContent=S.w.ok.how==="spoken"?"A spoken yes is not enough. Get it in writing: ask your client to reply yes to the email with your quote.":S.w.ok.how==="email"?"Keep that email. It is your agreement.":"Keep the signed quote. It is your agreement.";
  });
  var rb2=document.getElementById("resetBtn"); if(rb2) rb2.disabled=JSON.stringify(S.w.q.lines)===JSON.stringify(S.w.inv.lines||S.w.q.lines);
  var live=document.getElementById("live");
  live.innerHTML=S.step===0?"":S.step<=6?'Quote total<b>'+eur2(qs.tot)+'</b>':'Invoice total<b>'+eur2(is.tot)+'</b>';
  persist();
}
function shareUrl(){var base="";try{base=location.href.split("#")[0];}catch(e){}return base+"#s="+(CODE&&codeFor===JSON.stringify(compact())?CODE:encodeSync());}
function refreshLink(){
  var u=shareUrl();
  document.querySelectorAll('[data-o="link"]').forEach(function(el){el.textContent=u;el.setAttribute("href",u);});
}

/* ---------- render & events ---------- */
var stage=document.getElementById("stage");
function render(focus){
  stage.innerHTML=STEPS[S.step].r();
  document.getElementById("progress").innerHTML='<span>'+(S.step?(S.step<=6?"Round 1":"Round 2")+" · Step "+S.step+" of 9 · "+STEPS[S.step].t:"Start")+'</span><span>'+(S.step?"Started from "+PEOPLE[S.start].who:"")+'</span>';
  document.getElementById("back").style.visibility=S.step===0?"hidden":"";
  var n=document.getElementById("next"); n.textContent=S.step===0?"Begin":S.step===6?"Round 2":S.step===LAST?"Save as PDF":"Next";
  update();
  refreshLink();
  if(focus){var h=stage.querySelector("h1");if(h)h.focus({preventScroll:true});window.scrollTo(0,0);}
}
function go(d){S.step=Math.min(LAST,Math.max(0,S.step+d));render(true);}
document.getElementById("next").onclick=function(){if(S.step<LAST)go(1);else printDoc("invoice");};
document.getElementById("back").onclick=function(){if(S.step>0)go(-1);};
function onEdit(e){
  var t=e.target,p=t.getAttribute("data-p"),l=t.getAttribute("data-l"),bi=t.getAttribute("data-bi");
  if(bi!==null){var it=S.w.br.items[+bi];if(it){it.d=String(t.value).slice(0,120);var e3=(PEOPLE[S.start].v.br.items||[])[+bi];t.classList.toggle("ex",!!(e3&&e3.d===it.d));update();}return;}
  if(p){
    var val=t.type==="number"?Math.max(0,Math.round(parseFloat(t.value)||0)):String(t.value).slice(0,300);
    set(p,val); if(t.classList) t.classList.toggle("ex",isEx(p)); update(); return;
  }
  if(l){
    var parts=l.split("."),arr=parts[0]==="qL"?S.w.q.lines:S.w.inv.lines,i=+parts[1],k=parts[2];
    if(!arr[i]) return;
    if(k==="q"||k==="p"){var n=parseFloat(String(t.value).replace(",","."));arr[i][k]=isFinite(n)&&n>=0?n:0;}
    else arr[i][k]=String(t.value).slice(0,120);
    if(parts[0]==="qL"){var e2=PEOPLE[S.start].v.q.lines[i];t.classList.toggle("ex",!!(e2&&String(e2[k])===String(arr[i][k]))&&t.tagName!=="SELECT");}
    else t.classList.remove("ex");
    update();
  }
}
stage.addEventListener("input",onEdit);
stage.addEventListener("change",function(e){if(e.target.tagName==="SELECT")onEdit(e);});
stage.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-start")){var p=b.getAttribute("data-start");S.start=p;S.w=fresh(p);render(false);return;}
  if(b.hasAttribute("data-mode")){var md=b.getAttribute("data-mode");S.w.mode=md;
    if(!S.w.q.lines.length&&!(S.w.br.items||[]).length) S.w.q.lines.push(md==="hours"?{d:"Design work",q:10,u:"hours",p:0}:{d:"Fee",q:1,u:"item",p:0});
    S.w.q.lines.forEach(function(l){
      if(md==="hours"&&l.was&&l.u==="item"&&l.q===1&&l.p===r2(l.was.q*l.was.p)){l.u="hours";l.q=l.was.q;l.p=l.was.p;delete l.was;}
      else if(md==="fee"&&l.u==="hours"){l.was={q:l.q,p:l.p};l.u="item";l.p=r2(l.q*l.p);l.q=1;}
    });
    render(false);return;}
  if(b.hasAttribute("data-ok")){S.w.ok.how=b.getAttribute("data-ok");if(!S.w.ok.date)S.w.ok.date=today();render(false);return;}
  if(b.hasAttribute("data-badd")){if(!S.w.br.items)S.w.br.items=[];if(S.w.br.items.length<20)S.w.br.items.push({id:nextId(),d:""});render(false);var ins=stage.querySelectorAll("[data-bi]");if(ins.length)ins[ins.length-1].focus();return;}
  if(b.hasAttribute("data-bdel")){S.w.br.items.splice(+b.getAttribute("data-bdel"),1);render(false);return;}
  if(b.hasAttribute("data-add")){var w=b.getAttribute("data-add"),arr=w==="q"?S.w.q.lines:S.w.inv.lines;if(arr.length<20)arr.push({d:"",q:1,u:S.w.mode==="hours"?"hours":"item",p:0});render(false);return;}
  if(b.hasAttribute("data-del")){var pr=b.getAttribute("data-del").split("."),a2=pr[0]==="q"?S.w.q.lines:S.w.inv.lines;a2.splice(+pr[1],1);render(false);return;}
  var a=b.getAttribute("data-act");
  if(a==="reset"){S.w.inv.lines=copy(S.w.q.lines);render(false);var rm=document.getElementById("resetMsg");if(rm)rm.textContent="The lines are back to your quote.";return;}
  if(a==="print"){printDoc(b.getAttribute("data-what"));return;}
  if(a==="copy"){var url=shareUrl(),m=stage.querySelector('[data-o="copyMsg"]');
    var fallback=function(){var box=stage.querySelector('[data-o="link"]');var r=document.createRange();r.selectNodeContents(box);var s=window.getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Selected. Copy it from your phone's menu.";};
    try{navigator.clipboard.writeText(url).then(function(){m.textContent="Copied.";},fallback);}catch(err){fallback();}}
});
function printDoc(what){
  var u=shareUrl();
  document.getElementById("printarea").innerHTML=docHtml(what)+
    '<div class="reopen"><div class="qs"><h2>Questions to take home</h2><p>What did your client not tell you, and when and how could you have asked?</p><p>Did you lower your price before anyone asked you to?</p><p>What would you rather have put in your quote than done for free?</p><p>Has a client ever asked you to do something for free before giving you a proper assignment?</p></div><p><b>Reopen this in the tool.</b> Tap the link below. Everything lives in the link, not with us.</p><p><a href="'+esc(u)+'">Open it in the tool, as you left it</a></p></div>';
  var prev=document.title;
  try{document.title=(what==="quote"?"Quote "+S.w.q.no:"Invoice "+S.w.inv.no)+" "+(S.w.me.name||"");}catch(e){}
  var done=function(){document.title=prev;window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  try{window.print();}catch(err){}
}
var rb=document.getElementById("readable");
try{if(localStorage.getItem("ec-readable")==="1"){document.body.classList.add("readable");rb.setAttribute("aria-pressed","true");}}catch(e){}
rb.onclick=function(){var on=document.body.classList.toggle("readable");rb.setAttribute("aria-pressed",String(on));try{localStorage.setItem("ec-readable",on?"1":"0");}catch(e){}};

load().then(function(){},function(){}).then(function(){render(false);refreshLink();});
})();
</script>
